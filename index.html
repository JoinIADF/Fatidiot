<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PIG COMMANDO — vs Bots & Spammers</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a12;
    overflow: hidden;
    font-family: "Courier New", Courier, monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 20%, #1a2035 0%, #0a0a12 70%);
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #4a90d9;
    box-shadow:
      0 0 0 4px #2a2010,
      0 0 0 8px #c4a35a,
      0 12px 40px rgba(0,0,0,0.6);
    max-width: 96vw;
    max-height: 92vh;
    cursor: crosshair;
  }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #6a6050;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>
</div>
<div id="hint">←→ / A D move · SPACE / W jump · CLICK / X shoot · P pause</div>
<script>
(() => {
  "use strict";

  // ─── Canvas (low-res pixel look, scaled up) ───
  const W = 320, H = 180;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  function fitCanvas() {
    const scale = Math.min(
      (window.innerWidth * 0.96) / W,
      (window.innerHeight * 0.92) / H
    );
    const s = Math.max(2, Math.floor(scale));
    canvas.style.width = W * s + "px";
    canvas.style.height = H * s + "px";
  }
  fitCanvas();
  window.addEventListener("resize", fitCanvas);

  // ─── Palette ───
  const C = {
    skyTop: "#5eb3e8",
    skyBot: "#8ec8f0",
    sun: "#ffe566",
    mountain: "#6b8f5a",
    mountainDk: "#4a6b3a",
    sand: "#e8c878",
    sandDk: "#c4a050",
    sandLine: "#d4b060",
    bush: "#3d7a3a",
    bushDk: "#2a5528",
    pink: "#f4a0b8",
    pinkDk: "#d07090",
    pinkLt: "#ffc0d0",
    snout: "#e888a0",
    camo: "#8a9a5a",
    camoDk: "#5a6a3a",
    vest: "#6b7a40",
    helmet: "#7a8a4a",
    boot: "#4a4030",
    eye: "#1a1010",
    white: "#f8f8f0",
    black: "#1a1010",
    bot: "#7a8a9a",
    botDk: "#4a5560",
    botEye: "#ff4040",
    spam: "#ff60c0",
    spam2: "#60e0ff",
    spam3: "#ffd040",
    heart: "#ff4060",
    ban: "#ff5050",
    mute: "#60a0ff",
    verified: "#40b0ff",
    gold: "#ffd040",
    ui: "#fff8e0",
    uiDim: "#c0b080",
    red: "#e04040",
    green: "#40d060",
    shadow: "rgba(0,0,0,0.25)",
  };

  // ─── Audio (Web Audio beeps) ───
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { /* silent */ }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type = "square", vol = 0.08, slide = 0) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const SFX = {
    shoot: () => beep(520, 0.06, "square", 0.06, -200),
    jump: () => beep(180, 0.1, "square", 0.07, 220),
    hit: () => beep(140, 0.08, "sawtooth", 0.07, -60),
    kill: () => { beep(300, 0.06, "square", 0.07); setTimeout(() => beep(450, 0.08, "square", 0.06), 40); },
    hurt: () => beep(90, 0.2, "sawtooth", 0.1, -40),
    power: () => { beep(400, 0.08, "square", 0.07); setTimeout(() => beep(600, 0.1, "square", 0.07), 60); },
    nuke: () => { beep(80, 0.3, "sawtooth", 0.12, 200); setTimeout(() => beep(200, 0.25, "square", 0.08, -100), 80); },
    wave: () => { beep(330, 0.1, "square", 0.07); setTimeout(() => beep(440, 0.1, "square", 0.07), 80); setTimeout(() => beep(550, 0.15, "square", 0.08), 160); },
    pickup: () => beep(700, 0.12, "triangle", 0.07, 200),
    ui: () => beep(440, 0.05, "square", 0.05),
    gameover: () => { beep(200, 0.15, "sawtooth", 0.1); setTimeout(() => beep(140, 0.2, "sawtooth", 0.1), 120); setTimeout(() => beep(90, 0.35, "sawtooth", 0.1), 280); },
  };

  // ─── Input ───
  const keys = Object.create(null);
  let mouseDown = false;
  let mouseX = W / 2, mouseY = H / 2;
  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    ensureAudio();
    if (state.mode === "title") startGame();
    else if (state.mode === "gameover" && (e.code === "Enter" || e.code === "Space")) startGame();
    else if (e.code === "KeyP" && (state.mode === "play" || state.mode === "pause")) {
      state.mode = state.mode === "play" ? "pause" : "play";
      SFX.ui();
    }
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });
  canvas.addEventListener("mousedown", (e) => {
    ensureAudio();
    mouseDown = true;
    const r = canvas.getBoundingClientRect();
    mouseX = ((e.clientX - r.left) / r.width) * W;
    mouseY = ((e.clientY - r.top) / r.height) * H;
    if (state.mode === "title") startGame();
    else if (state.mode === "gameover") {
      // restart hit zone roughly center bottom
      if (mouseY > 120) startGame();
    }
  });
  window.addEventListener("mouseup", () => { mouseDown = false; });
  canvas.addEventListener("mousemove", (e) => {
    const r = canvas.getBoundingClientRect();
    mouseX = ((e.clientX - r.left) / r.width) * W;
    mouseY = ((e.clientY - r.top) / r.height) * H;
  });
  // prevent context menu on canvas
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  // ─── Helpers ───
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const irand = (a, b) => (a + Math.floor(Math.random() * (b - a + 1)));
  const chance = (p) => Math.random() < p;
  const rects = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function pxFont(size) {
    ctx.font = `${size}px "Courier New", monospace`;
    ctx.textBaseline = "top";
  }

  // ─── World constants ───
  const GROUND_Y = 148;
  const GRAVITY = 0.28;
  const HS_KEY = "pigCommandoHS";

  // ─── Game state ───
  const state = {
    mode: "title", // title | play | wave | pause | gameover
    t: 0,
    score: 0,
    high: Number(localStorage.getItem(HS_KEY) || 0),
    lives: 3,
    wave: 1,
    combo: 0,
    comboTimer: 0,
    flashMsg: "",
    flashTimer: 0,
    invuln: 0,
    shake: 0,
    bgScroll: 0,
  };

  let player, enemies, bullets, eBullets, particles, powerups;
  let spawnQueue = [];
  let waveTimer = 0;
  let shootCD = 0;

  function resetEntities() {
    player = {
      x: 40, y: GROUND_Y - 18,
      w: 14, h: 18,
      vx: 0, vy: 0,
      facing: 1,
      onGround: true,
      anim: "idle",
      frame: 0,
      frameT: 0,
      shootT: 0,
      rapid: 0,
      shield: 0,
    };
    enemies = [];
    bullets = [];
    eBullets = [];
    particles = [];
    powerups = [];
    spawnQueue = [];
    shootCD = 0;
  }

  function startGame() {
    ensureAudio();
    SFX.ui();
    state.mode = "play";
    state.score = 0;
    state.lives = 3;
    state.wave = 1;
    state.combo = 0;
    state.comboTimer = 0;
    state.flashMsg = "";
    state.flashTimer = 0;
    state.invuln = 0;
    state.shake = 0;
    resetEntities();
    beginWave();
  }

  // ─── Waves ───
  const WAVE_MSGS = [
    "BOTS BANNED!",
    "SPAMMERS MUTED!",
    "404: ENEMIES NOT FOUND!",
    "COMMANDO CLEAN SWEEP!",
    "ALGORITHM REJECTED!",
    "FOLLOW FOR NOTHING!",
    "VERIFIED VICTORY!",
    "MUTED THE MOB!",
    "PIG > BOTS!",
    "SPAM FILTERED!",
  ];

  function wavePlan(n) {
    const bots = 3 + n * 2;
    const spams = Math.floor(n * 1.2) + (n > 1 ? 1 : 0);
    const plan = [];
    for (let i = 0; i < bots; i++) plan.push({ type: "bot", delay: 40 + i * 45 - Math.min(n * 3, 20) });
    for (let i = 0; i < spams; i++) plan.push({ type: "spam", delay: 90 + i * 70 - Math.min(n * 4, 30) });
    // shuffle lightly
    for (let i = plan.length - 1; i > 0; i--) {
      if (chance(0.4)) {
        const j = irand(0, i);
        [plan[i], plan[j]] = [plan[j], plan[i]];
      }
    }
    // re-delay sequentially-ish
    let t = 30;
    plan.forEach((p, i) => {
      p.delay = t;
      t += Math.max(18, 50 - n * 2) + irand(0, 20);
    });
    return plan;
  }

  function beginWave() {
    spawnQueue = wavePlan(state.wave);
    state.flashMsg = `WAVE ${state.wave}`;
    state.flashTimer = 90;
    SFX.wave();
  }

  function spawnEnemy(type) {
    const side = chance(0.5) ? -1 : 1;
    const drop = type === "spam" && chance(0.35);
    const x = drop ? rand(30, W - 40) : (side < 0 ? -16 : W + 4);
    const y = drop ? -12 : GROUND_Y - (type === "bot" ? 14 : 16);
    enemies.push({
      type,
      x, y,
      w: type === "bot" ? 12 : 13,
      h: type === "bot" ? 14 : 16,
      vx: 0,
      vy: drop ? 0.5 : 0,
      hp: type === "bot" ? 1 : 2,
      facing: side < 0 ? 1 : -1,
      shootT: irand(40, 90),
      frame: 0,
      frameT: 0,
      drop,
    });
  }

  // ─── Particles ───
  function burst(x, y, cols, n = 10, speed = 2) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(0.5, speed);
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - rand(0, 1),
        life: irand(18, 40),
        max: 40,
        col: cols[irand(0, cols.length - 1)],
        size: irand(1, 3),
        text: null,
      });
    }
  }
  function textPop(x, y, text, col) {
    particles.push({
      x, y, vx: rand(-0.3, 0.3), vy: -0.8,
      life: 40, max: 40, col, size: 1, text,
    });
  }

  // ─── Combat ───
  function shoot() {
    if (shootCD > 0) return;
    const rapid = player.rapid > 0;
    shootCD = rapid ? 6 : 14;
    player.shootT = 8;
    player.anim = "shoot";
    const dir = player.facing;
    // slight aim toward mouse if on same side
    let ang = 0;
    const dx = mouseX - (player.x + player.w / 2);
    if (Math.sign(dx) === dir || Math.abs(dx) < 20) {
      const dy = mouseY - (player.y + 6);
      ang = clamp(dy / 80, -0.35, 0.35);
    }
    bullets.push({
      x: player.x + (dir > 0 ? player.w : -4),
      y: player.y + 6,
      w: 6, h: 5,
      vx: dir * 4.2,
      vy: ang * 4.2,
      life: 60,
      kind: chance(0.5) ? "ban" : "mute",
    });
    SFX.shoot();
  }

  function killEnemy(e, idx) {
    const confetti = e.type === "bot"
      ? [C.bot, C.botDk, C.white, C.gold]
      : [C.spam, C.spam2, C.spam3, C.heart, C.white];
    burst(e.x + e.w / 2, e.y + e.h / 2, confetti, 14, 2.8);
    textPop(e.x, e.y - 4, e.type === "bot" ? "404" : "MUTED", C.gold);
    const base = e.type === "bot" ? 10 : 25;
    state.combo = state.comboTimer > 0 ? state.combo + 1 : 1;
    state.comboTimer = 90;
    const mult = Math.min(5, 1 + Math.floor((state.combo - 1) / 2));
    const pts = base * mult;
    state.score += pts;
    textPop(e.x + 4, e.y - 10, mult > 1 ? `+${pts} x${mult}` : `+${pts}`, C.ui);
    if (chance(0.18 + state.wave * 0.01)) dropPower(e.x + e.w / 2, e.y);
    enemies.splice(idx, 1);
    SFX.kill();
    state.shake = 3;
  }

  function dropPower(x, y) {
    const kinds = ["rapid", "shield", "nuke"];
    // nuke rarer
    const r = Math.random();
    const kind = r < 0.42 ? "rapid" : r < 0.8 ? "shield" : "nuke";
    powerups.push({
      x: x - 5, y: y, w: 10, h: 10,
      vy: -1.5, onGround: false, kind, life: 400,
    });
  }

  function doNuke() {
    SFX.nuke();
    state.shake = 10;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      burst(e.x + e.w / 2, e.y + e.h / 2, [C.gold, C.ban, C.white, C.spam2], 16, 3.5);
      state.score += e.type === "bot" ? 10 : 25;
      enemies.splice(i, 1);
    }
    eBullets.length = 0;
    textPop(W / 2 - 20, H / 2 - 20, "NUKE!", C.gold);
    state.flashMsg = "SCREEN CLEARED!";
    state.flashTimer = 60;
  }

  function hurtPlayer() {
    if (state.invuln > 0) return;
    if (player.shield > 0) {
      player.shield = 0;
      state.invuln = 40;
      burst(player.x + 7, player.y + 8, [C.verified, C.white], 8, 2);
      SFX.hit();
      return;
    }
    state.lives -= 1;
    state.invuln = 70;
    state.shake = 6;
    state.combo = 0;
    burst(player.x + 7, player.y + 8, [C.pink, C.camo, C.white], 10, 2.2);
    SFX.hurt();
    if (state.lives <= 0) {
      state.mode = "gameover";
      if (state.score > state.high) {
        state.high = state.score;
        localStorage.setItem(HS_KEY, String(state.high));
      }
      SFX.gameover();
    }
  }

  // ─── Update ───
  function update() {
    state.t++;
    if (state.mode === "title" || state.mode === "gameover" || state.mode === "pause") return;

    if (state.flashTimer > 0) state.flashTimer--;
    if (state.comboTimer > 0) {
      state.comboTimer--;
      if (state.comboTimer <= 0) state.combo = 0;
    }
    if (state.invuln > 0) state.invuln--;
    if (state.shake > 0) state.shake--;
    if (shootCD > 0) shootCD--;
    if (player.rapid > 0) player.rapid--;
    if (player.shield > 0) player.shield--;
    if (player.shootT > 0) player.shootT--;

    state.bgScroll += 0.15;

    // player movement
    let move = 0;
    if (keys["ArrowLeft"] || keys["KeyA"]) move -= 1;
    if (keys["ArrowRight"] || keys["KeyD"]) move += 1;
    player.vx = move * 1.6;
    if (move !== 0) player.facing = move;

    const wantJump = keys["Space"] || keys["KeyW"] || keys["ArrowUp"];
    if (wantJump && player.onGround) {
      player.vy = -4.6;
      player.onGround = false;
      SFX.jump();
    }

    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;
    player.x = clamp(player.x, 2, W - player.w - 2);

    if (player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
    }

    // anim
    player.frameT++;
    if (player.shootT > 0) player.anim = "shoot";
    else if (!player.onGround) player.anim = "jump";
    else if (Math.abs(player.vx) > 0.1) player.anim = "run";
    else player.anim = "idle";
    if (player.frameT > (player.anim === "run" ? 6 : 12)) {
      player.frameT = 0;
      player.frame = (player.frame + 1) % 4;
    }

    // shoot
    if ((mouseDown || keys["KeyX"]) && state.mode === "play") shoot();

    // spawn queue
    if (state.mode === "play" && spawnQueue.length) {
      for (let i = spawnQueue.length - 1; i >= 0; i--) {
        spawnQueue[i].delay--;
        if (spawnQueue[i].delay <= 0) {
          spawnEnemy(spawnQueue[i].type);
          spawnQueue.splice(i, 1);
        }
      }
    }

    // enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.frameT = (e.frameT || 0) + 1;
      if (e.frameT > 8) { e.frameT = 0; e.frame = ((e.frame || 0) + 1) % 2; }

      if (e.drop && e.y + e.h < GROUND_Y) {
        e.vy += GRAVITY * 0.6;
        e.y += e.vy;
        if (e.y + e.h >= GROUND_Y) {
          e.y = GROUND_Y - e.h;
          e.vy = 0;
          e.drop = false;
        }
      } else {
        const speed = e.type === "bot" ? 0.45 + state.wave * 0.04 : 0.7 + state.wave * 0.05;
        const dx = (player.x + player.w / 2) - (e.x + e.w / 2);
        e.facing = dx >= 0 ? 1 : -1;
        e.vx = Math.sign(dx) * speed;
        e.x += e.vx;
        e.y = GROUND_Y - e.h;
      }

      // spammer shots
      if (e.type === "spam") {
        e.shootT--;
        if (e.shootT <= 0 && !e.drop) {
          e.shootT = Math.max(35, 80 - state.wave * 4);
          const kinds = ["!!!", "♥", "f4f", "BOT"];
          const k = kinds[irand(0, kinds.length - 1)];
          const px = player.x + player.w / 2;
          const py = player.y + player.h / 2;
          const ex = e.x + e.w / 2;
          const ey = e.y + 4;
          let vx = px - ex, vy = py - ey;
          const len = Math.hypot(vx, vy) || 1;
          const sp = 1.3 + state.wave * 0.08;
          eBullets.push({
            x: ex - 3, y: ey, w: 7, h: 6,
            vx: (vx / len) * sp, vy: (vy / len) * sp,
            life: 120, kind: k,
          });
        }
      }

      // touch player
      if (rects(player, e) && state.invuln <= 0) {
        hurtPlayer();
      }

      // off screen cleanup far away
      if (e.x < -40 || e.x > W + 40) {
        enemies.splice(i, 1);
      }
    }

    // player bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      if (b.life <= 0 || b.x < -10 || b.x > W + 10) { bullets.splice(i, 1); continue; }
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (rects(b, e)) {
          e.hp--;
          burst(b.x, b.y, [C.ban, C.mute, C.white], 4, 1.5);
          bullets.splice(i, 1);
          SFX.hit();
          if (e.hp <= 0) killEnemy(e, j);
          break;
        }
      }
    }

    // enemy bullets
    for (let i = eBullets.length - 1; i >= 0; i--) {
      const b = eBullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      if (b.life <= 0 || b.x < -10 || b.x > W + 10 || b.y > H) {
        eBullets.splice(i, 1);
        continue;
      }
      if (rects(b, player)) {
        eBullets.splice(i, 1);
        hurtPlayer();
      }
    }

    // powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.life--;
      if (!p.onGround) {
        p.vy += GRAVITY * 0.5;
        p.y += p.vy;
        if (p.y + p.h >= GROUND_Y) {
          p.y = GROUND_Y - p.h;
          p.vy = 0;
          p.onGround = true;
        }
      } else {
        p.y = GROUND_Y - p.h + Math.sin(state.t * 0.15 + i) * 1.5;
      }
      if (p.life <= 0) { powerups.splice(i, 1); continue; }
      if (rects(player, p)) {
        if (p.kind === "rapid") {
          player.rapid = 300;
          state.flashMsg = "RAPID FIRE!";
        } else if (p.kind === "shield") {
          player.shield = 360;
          state.flashMsg = "VERIFIED!";
        } else if (p.kind === "nuke") {
          doNuke();
          state.flashMsg = "BAN HAMMER!";
        }
        state.flashTimer = 50;
        SFX.pickup();
        SFX.power();
        burst(p.x + 5, p.y + 5, [C.gold, C.verified, C.white], 10, 2);
        powerups.splice(i, 1);
      }
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.05;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // wave clear
    if (state.mode === "play" && spawnQueue.length === 0 && enemies.length === 0) {
      state.mode = "wave";
      waveTimer = 110;
      state.flashMsg = WAVE_MSGS[irand(0, WAVE_MSGS.length - 1)];
      state.flashTimer = 100;
      state.score += 50 + state.wave * 10;
      SFX.wave();
    }
    if (state.mode === "wave") {
      waveTimer--;
      if (waveTimer <= 0) {
        state.wave++;
        state.mode = "play";
        beginWave();
      }
    }
  }

  // ─── Draw helpers ───
  function fill(c) { ctx.fillStyle = c; }
  function rect(x, y, w, h, c) {
    if (c) fill(c);
    ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, C.skyTop);
    g.addColorStop(1, C.skyBot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND_Y);

    // sun
    rect(260, 18, 18, 18, C.sun);
    rect(258, 20, 22, 14, C.sun);
    rect(262, 16, 14, 22, C.sun);

    // distant mountains (parallax-ish)
    const ox = -((state.bgScroll * 0.3) % 80);
    fill(C.mountainDk);
    for (let i = -1; i < 6; i++) {
      const mx = ox + i * 70;
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y);
      ctx.lineTo(mx + 25, GROUND_Y - 28 - (i % 3) * 6);
      ctx.lineTo(mx + 50, GROUND_Y);
      ctx.fill();
    }
    fill(C.mountain);
    const ox2 = -((state.bgScroll * 0.5) % 60);
    for (let i = -1; i < 7; i++) {
      const mx = ox2 + i * 55 + 10;
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y);
      ctx.lineTo(mx + 18, GROUND_Y - 16 - (i % 2) * 5);
      ctx.lineTo(mx + 36, GROUND_Y);
      ctx.fill();
    }
  }

  function drawGround() {
    rect(0, GROUND_Y, W, H - GROUND_Y, C.sand);
    rect(0, GROUND_Y, W, 3, C.sandDk);
    // sand grain lines
    fill(C.sandLine);
    for (let i = 0; i < 12; i++) {
      const x = ((i * 37 + state.bgScroll * 0.8) % (W + 20)) - 10;
      ctx.fillRect(x | 0, GROUND_Y + 8 + (i % 3) * 6, 12 + (i % 4), 1);
    }
    // bushes
    const bushes = [
      [20, 4], [90, 3], [160, 5], [230, 3], [290, 4],
    ];
    for (const [bx, s] of bushes) {
      const x = ((bx - state.bgScroll * 0.6) % (W + 40) + W + 40) % (W + 40) - 20;
      rect(x, GROUND_Y - s - 2, s + 2, s + 2, C.bushDk);
      rect(x + 1, GROUND_Y - s - 3, s, s + 1, C.bush);
    }
  }

  // ─── Sprites (procedural pixel art) ───
  function drawPig(p) {
    const blink = state.invuln > 0 && Math.floor(state.t / 3) % 2 === 0;
    if (blink) return;

    const f = p.facing;
    const x = p.x | 0, y = p.y | 0;
    const bob = p.anim === "run" ? (p.frame % 2) : 0;
    const leg = p.anim === "run" ? (p.frame % 2 ? 1 : -1) : 0;
    const crouch = p.anim === "shoot" ? 1 : 0;
    const jumpStretch = p.anim === "jump" ? 1 : 0;

    ctx.save();
    if (f < 0) {
      ctx.translate(x + p.w, y);
      ctx.scale(-1, 1);
    } else {
      ctx.translate(x, y);
    }

    // shadow
    rect(2, p.h - 1, 10, 2, C.shadow);

    // legs / boots
    rect(3, 14 + bob - jumpStretch, 3, 4 + jumpStretch, C.boot);
    rect(8, 14 - bob - jumpStretch, 3, 4 + jumpStretch, C.boot);
    if (p.anim === "run") {
      rect(3 + leg, 15, 3, 3, C.boot);
      rect(8 - leg, 15, 3, 3, C.boot);
    }

    // body (chubby)
    rect(2, 6 + crouch, 11, 9, C.pink);
    rect(1, 8 + crouch, 13, 6, C.pink);
    // camo vest
    rect(3, 7 + crouch, 9, 7, C.vest);
    rect(4, 8 + crouch, 2, 2, C.camo);
    rect(8, 9 + crouch, 2, 2, C.camoDk);
    rect(5, 11 + crouch, 2, 1, C.camo);

    // head
    const hy = 1 + crouch;
    rect(3, hy, 9, 7, C.pink);
    rect(2, hy + 1, 11, 5, C.pink);
    // snout
    rect(10, hy + 3, 4, 3, C.snout);
    rect(12, hy + 4, 1, 1, C.pinkDk);
    rect(13, hy + 4, 1, 1, C.pinkDk);
    // ear
    rect(3, hy - 1, 2, 2, C.pinkDk);
    // eye
    rect(8, hy + 2, 2, 2, C.eye);
    rect(8, hy + 2, 1, 1, C.white);
    // helmet
    rect(2, hy - 1, 9, 3, C.helmet);
    rect(3, hy - 2, 7, 2, C.helmet);
    rect(10, hy, 2, 2, C.camoDk); // goggles bit
    // radio antenna
    rect(2, hy - 4, 1, 3, C.botDk);
    rect(1, hy - 4, 2, 1, C.bot);

    // arms + rifle
    const ay = 8 + crouch;
    if (p.anim === "shoot") {
      rect(11, ay, 8, 2, C.boot); // barrel
      rect(12, ay - 1, 3, 1, C.camoDk);
      rect(9, ay + 1, 3, 3, C.pink); // hand
    } else {
      rect(11, ay + 1, 5, 2, C.boot);
      rect(9, ay + 2, 3, 3, C.pink);
    }

    // verified shield aura
    if (p.shield > 0) {
      const pulse = 0.5 + 0.5 * Math.sin(state.t * 0.2);
      ctx.globalAlpha = 0.35 + pulse * 0.25;
      rect(0, 0, 16, 18, C.verified);
      ctx.globalAlpha = 1;
      // mini badge
      rect(12, 2, 5, 5, C.verified);
      rect(13, 3, 3, 3, C.white);
      rect(14, 4, 1, 2, C.verified);
    }

    // rapid fire glow on gun
    if (p.rapid > 0 && p.anim === "shoot") {
      rect(18, ay, 2, 2, C.gold);
    }

    ctx.restore();
  }

  function drawBot(e) {
    const x = e.x | 0, y = e.y | 0;
    const bob = (e.frame || 0);
    // body
    rect(x + 1, y + 3, 10, 9, C.bot);
    rect(x + 2, y + 4, 8, 7, C.botDk);
    // head
    rect(x + 2, y, 8, 5, C.bot);
    rect(x + 3, y + 1, 2, 2, C.botEye);
    rect(x + 7, y + 1, 2, 2, C.botEye);
    // antenna
    rect(x + 5, y - 2, 1, 2, C.botDk);
    rect(x + 4, y - 3, 3, 1, C.red);
    // legs
    rect(x + 2, y + 12, 3, 2 + bob, C.botDk);
    rect(x + 7, y + 12, 3, 2 + (1 - bob), C.botDk);
    // arm
    rect(x + (e.facing > 0 ? 10 : -1), y + 6, 3, 2, C.bot);
  }

  function drawSpammer(e) {
    const x = e.x | 0, y = e.y | 0;
    const flash = Math.floor(state.t / 4 + e.x) % 3;
    const cols = [C.spam, C.spam2, C.spam3];
    const col = cols[flash];
    // flashy body
    rect(x + 1, y + 2, 11, 11, col);
    rect(x + 2, y + 3, 9, 9, C.white);
    rect(x + 3, y + 4, 7, 7, col);
    // big grin / spam face
    rect(x + 4, y + 5, 2, 2, C.eye);
    rect(x + 8, y + 5, 2, 2, C.eye);
    rect(x + 4, y + 9, 6, 1, C.eye);
    rect(x + 3, y + 8, 1, 1, C.eye);
    rect(x + 9, y + 8, 1, 1, C.eye);
    // hat / megaphone vibe
    rect(x + 3, y, 7, 2, C.spam3);
    rect(x + 5, y - 2, 3, 2, C.heart);
    // legs
    const bob = e.frame || 0;
    rect(x + 3, y + 13, 2, 3 + bob, C.spam);
    rect(x + 8, y + 13, 2, 3 + (1 - bob), C.spam2);
  }

  function drawBanBullet(b) {
    const x = b.x | 0, y = b.y | 0;
    if (b.kind === "ban") {
      // little hammer / ban
      rect(x, y + 1, 6, 2, C.ban);
      rect(x + 4, y, 2, 4, C.ban);
      rect(x + 1, y + 2, 1, 3, C.boot);
    } else {
      // mute speaker
      rect(x, y + 1, 3, 3, C.mute);
      rect(x + 3, y, 2, 5, C.mute);
      rect(x + 5, y + 1, 1, 1, C.white);
      rect(x + 5, y + 3, 1, 1, C.white);
    }
  }

  function drawEBullet(b) {
    const x = b.x | 0, y = b.y | 0;
    if (b.kind === "♥") {
      rect(x + 1, y, 2, 2, C.heart);
      rect(x + 4, y, 2, 2, C.heart);
      rect(x, y + 1, 7, 2, C.heart);
      rect(x + 1, y + 3, 5, 1, C.heart);
      rect(x + 2, y + 4, 3, 1, C.heart);
    } else {
      pxFont(6);
      fill(b.kind === "!!!" ? C.spam3 : b.kind === "f4f" ? C.spam2 : C.spam);
      ctx.fillText(b.kind, x, y);
    }
  }

  function drawPower(p) {
    const x = p.x | 0, y = p.y | 0;
    const pulse = Math.sin(state.t * 0.25) * 0.5 + 0.5;
    if (p.kind === "rapid") {
      rect(x, y, 10, 10, C.gold);
      rect(x + 1, y + 1, 8, 8, C.black);
      rect(x + 3, y + 2, 4, 6, C.gold);
      rect(x + 2, y + 4, 6, 2, C.gold);
    } else if (p.kind === "shield") {
      rect(x, y, 10, 10, C.verified);
      rect(x + 1, y + 1, 8, 8, C.white);
      rect(x + 3, y + 2, 4, 5, C.verified);
      rect(x + 4, y + 3, 2, 3, C.white);
    } else {
      rect(x, y, 10, 10, C.ban);
      rect(x + 1, y + 1, 8, 8, C.black);
      // star-ish
      rect(x + 4, y + 1, 2, 8, C.gold);
      rect(x + 1, y + 4, 8, 2, C.gold);
    }
    if (pulse > 0.6) rect(x - 1, y - 1, 12, 1, C.white);
  }

  function drawParticles() {
    for (const p of particles) {
      const a = clamp(p.life / 10, 0, 1);
      ctx.globalAlpha = a;
      if (p.text) {
        pxFont(7);
        fill(p.col);
        ctx.fillText(p.text, p.x | 0, p.y | 0);
      } else {
        rect(p.x, p.y, p.size, p.size, p.col);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawUI() {
    // top bar
    rect(0, 0, W, 12, "rgba(20,16,10,0.45)");
    pxFont(8);
    fill(C.ui);
    ctx.fillText(`SCORE ${state.score}`, 4, 2);
    ctx.fillText(`WAVE ${state.wave}`, 130, 2);

    // high score
    fill(C.uiDim);
    ctx.fillText(`HI ${state.high}`, 200, 2);

    // lives as little pigs
    for (let i = 0; i < state.lives; i++) {
      const lx = 280 + i * 12;
      rect(lx, 2, 6, 5, C.pink);
      rect(lx + 1, 1, 4, 2, C.helmet);
      rect(lx + 4, 3, 2, 2, C.snout);
    }

    // combo
    if (state.combo >= 2) {
      pxFont(8);
      fill(C.gold);
      ctx.fillText(`COMBO x${Math.min(5, 1 + Math.floor((state.combo - 1) / 2))}`, 4, 14);
    }

    // power status
    let px = 4;
    if (player && player.rapid > 0) {
      fill(C.gold);
      pxFont(6);
      ctx.fillText(`RAPID ${Math.ceil(player.rapid / 60)}s`, px, H - 10);
      px += 55;
    }
    if (player && player.shield > 0) {
      fill(C.verified);
      pxFont(6);
      ctx.fillText(`VERIFIED ${Math.ceil(player.shield / 60)}s`, px, H - 10);
    }

    // flash message
    if (state.flashTimer > 0 && state.flashMsg) {
      pxFont(10);
      const tw = ctx.measureText(state.flashMsg).width;
      const alpha = state.flashTimer < 15 ? state.flashTimer / 15 : 1;
      ctx.globalAlpha = alpha;
      fill("rgba(0,0,0,0.4)");
      ctx.fillRect((W - tw) / 2 - 6, 48, tw + 12, 16);
      fill(C.gold);
      ctx.fillText(state.flashMsg, (W - tw) / 2, 52);
      ctx.globalAlpha = 1;
    }
  }

  function drawTitle() {
    drawSky();
    drawGround();
    // decorative pig
    if (!player) {
      player = { x: W / 2 - 7, y: GROUND_Y - 18, w: 14, h: 18, facing: 1, anim: "idle", frame: Math.floor(state.t / 12) % 4, frameT: 0, shootT: 0, shield: 0, rapid: 0, onGround: true, vx: 0, vy: 0 };
    }
    player.x = W / 2 - 7;
    player.y = GROUND_Y - 18;
    player.anim = "idle";
    player.frame = Math.floor(state.t / 14) % 4;
    drawPig(player);

    // title block
    rect(40, 28, 240, 52, "rgba(20,16,10,0.55)");
    pxFont(16);
    fill(C.pink);
    ctx.fillText("PIG COMMANDO", 78, 36);
    pxFont(8);
    fill(C.camo);
    ctx.fillText("VS BOTS & SPAMMERS", 95, 56);
    pxFont(7);
    fill(C.gold);
    ctx.fillText("X COMMANDO  ·  PLATFORM CLEANUP UNIT", 62, 68);

    pxFont(8);
    const blink = Math.floor(state.t / 30) % 2 === 0;
    if (blink) {
      fill(C.ui);
      ctx.fillText("PRESS ANY KEY TO START", 78, 100);
    }

    pxFont(6);
    fill(C.uiDim);
    ctx.fillText("ARROWS/AD MOVE · SPACE JUMP · CLICK/X BAN", 55, 118);
    ctx.fillText(`HIGH SCORE  ${state.high}`, 118, 132);
  }

  function drawGameOver() {
    // dim overlay
    fill("rgba(10,8,5,0.72)");
    ctx.fillRect(0, 0, W, H);

    rect(50, 30, 220, 110, "rgba(30,24,12,0.9)");
    rect(52, 32, 216, 106, "rgba(60,48,24,0.5)");

    pxFont(14);
    fill(C.ban);
    ctx.fillText("GAME OVER", 108, 42);

    pxFont(7);
    fill(C.ui);
    const msg = "The algorithm won this round...";
    const msg2 = "try again, Commando Pig!";
    ctx.fillText(msg, 72, 62);
    ctx.fillText(msg2, 88, 74);

    pxFont(10);
    fill(C.gold);
    ctx.fillText(`SCORE  ${state.score}`, 110, 92);
    pxFont(7);
    fill(C.uiDim);
    ctx.fillText(`BEST  ${state.high}`, 128, 106);

    pxFont(8);
    const blink = Math.floor(state.t / 25) % 2 === 0;
    if (blink) {
      fill(C.green);
      ctx.fillText("[ ENTER / CLICK TO RESTART ]", 70, 122);
    }
  }

  function drawPause() {
    fill("rgba(0,0,0,0.45)");
    ctx.fillRect(0, 0, W, H);
    pxFont(12);
    fill(C.ui);
    ctx.fillText("PAUSED", 128, 80);
    pxFont(7);
    fill(C.uiDim);
    ctx.fillText("P TO RESUME", 120, 98);
  }

  // ─── Main render ───
  function render() {
    ctx.save();
    if (state.shake > 0) {
      ctx.translate(irand(-1, 1), irand(-1, 1));
    }

    if (state.mode === "title") {
      drawTitle();
      ctx.restore();
      return;
    }

    drawSky();
    drawGround();

    for (const p of powerups) drawPower(p);
    for (const e of enemies) {
      if (e.type === "bot") drawBot(e);
      else drawSpammer(e);
    }
    for (const b of eBullets) drawEBullet(b);
    for (const b of bullets) drawBanBullet(b);
    if (player) drawPig(player);
    drawParticles();
    drawUI();

    if (state.mode === "gameover") drawGameOver();
    if (state.mode === "pause") drawPause();

    ctx.restore();
  }

  // ─── Loop ───
  let last = performance.now();
  let acc = 0;
  const STEP = 1000 / 60;

  function frame(now) {
    acc += Math.min(100, now - last);
    last = now;
    while (acc >= STEP) {
      update();
      acc -= STEP;
    }
    render();
    requestAnimationFrame(frame);
  }

  // init title pig
  resetEntities();
  state.mode = "title";
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
