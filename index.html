<title>PIG COMMANDO — vs Bots & Spammers</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a12;
    overflow: hidden;
    font-family: "Courier New", Courier, monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 18%, #1a2035 0%, #0a0a12 70%);
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #4a90d9;
    box-shadow:
      0 0 0 3px #1a1408,
      0 0 0 7px #a88840,
      0 0 0 10px #3a3020,
      0 14px 48px rgba(0,0,0,0.65);
    max-width: 96vw;
    max-height: 92vh;
    cursor: crosshair;
  }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #6a6050;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>

    const h = map.length;
    const w = map[0].length;
    const pixels = new Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = map[y][x];
        pixels[y * w + x] = ch === " " || ch === "." ? null : (palette[ch] || null);
      }
    }
    return {
      w, h,
      draw(ox, oy, flipX) {
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const col = pixels[y * w + x];
            if (!col) continue;
            const dx = flipX ? ox + (w - 1 - x) : ox + x;
            ctx.fillStyle = col;
            ctx.fillRect(dx, oy + y, 1, 1);
          }
        }
      },
    };

  // ─── Audio ───
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) {}
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type = "square", vol = 0.08, slide = 0) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

      frame: 0,
      frameT: 0,
      shootT: 0,
      rapid: 0,
      shield: 0,
    };
    enemies = [];
    bullets = [];
    eBullets = [];
    particles = [];
    powerups = [];
    spawnQueue = [];
    shootCD = 0;
  }

  function startGame() {
    ensureAudio();
    SFX.ui();
    state.mode = "play";
    state.score = 0;
    state.lives = 3;
    state.wave = 1;
    state.combo = 0;
    state.comboTimer = 0;
    state.flashMsg = "";
    state.flashTimer = 0;
    state.invuln = 0;
    state.shake = 0;
    resetEntities();
    beginWave();
  }

  const WAVE_MSGS = [
    "BOTS BANNED!", "SPAMMERS MUTED!", "404: ENEMIES NOT FOUND!",
    "COMMANDO CLEAN SWEEP!", "ALGORITHM REJECTED!", "FOLLOW FOR NOTHING!",
    "VERIFIED VICTORY!", "MUTED THE MOB!", "PIG > BOTS!", "SPAM FILTERED!",
  ];

  function wavePlan(n) {
    const bots = 3 + n * 2;
    const spams = Math.floor(n * 1.2) + (n > 1 ? 1 : 0);
    const plan = [];
    for (let i = 0; i < bots; i++) plan.push({ type: "bot", delay: 0 });
    for (let i = 0; i < spams; i++) plan.push({ type: "spam", delay: 0 });
    for (let i = plan.length - 1; i > 0; i--) {
      if (chance(0.45)) {
        const j = irand(0, i);
        [plan[i], plan[j]] = [plan[j], plan[i]];
      }
    }
    let t = 40;
    plan.forEach((p) => {
      p.delay = t;
      t += Math.max(22, 55 - n * 2) + irand(0, 22);
    });
    return plan;
  }

  function beginWave() {
    spawnQueue = wavePlan(state.wave);
    state.flashMsg = `WAVE ${state.wave}`;
    state.flashTimer = 90;
    SFX.wave();
  }

  function spawnEnemy(type) {
    const side = chance(0.5) ? -1 : 1;
    const drop = type === "spam" && chance(0.35);
    const ew = type === "bot" ? 11 : 11;
    const eh = type === "bot" ? 12 : 12;
    const x = drop ? rand(40, W - 50) : (side < 0 ? -18 : W + 6);
    const y = drop ? -14 : GROUND_Y - eh;
    enemies.push({
      type, x, y, w: ew, h: eh, vx: 0, vy: drop ? 0.6 : 0,
      hp: type === "bot" ? 1 : 2,
      facing: side < 0 ? 1 : -1,
      shootT: irand(45, 100),
      frame: 0, frameT: 0, drop,
    });
  }

  function burst(x, y, cols, n = 12, speed = 2.4) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(0.4, speed);
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(0, 1.2),
        life: irand(20, 45), max: 45,
        col: cols[irand(0, cols.length - 1)],
        size: irand(1, 3), text: null,
      });
    }
  }
  function textPop(x, y, text, col) {
    particles.push({ x, y, vx: rand(-0.25, 0.25), vy: -0.9, life: 45, max: 45, col, size: 1, text });
  }

  function shoot() {
    if (shootCD > 0) return;
    const rapid = player.rapid > 0;
    shootCD = rapid ? 6 : 13;
    player.shootT = 10;
    player.anim = "shoot";
    const dir = player.facing;
    let ang = 0;
    const dx = mouseX - (player.x + player.w / 2);
    if (Math.sign(dx) === dir || Math.abs(dx) < 30) {
      const dy = mouseY - (player.y + 10);
      ang = clamp(dy / 100, -0.35, 0.35);
    }
    // muzzle roughly at rifle tip
    const mx = player.x + (dir > 0 ? player.w + 6 : -8);
    const my = player.y + 12;
    bullets.push({
      x: mx, y: my, w: 8, h: 6,
      vx: dir * 5.2, vy: ang * 5.2,
      life: 55, kind: chance(0.5) ? "ban" : "mute",
    });
    // muzzle flash particles
    burst(mx, my, [C.gold, C.goldLt, C.white], 3, 1.2);
    SFX.shoot();
  }

  function killEnemy(e, idx) {
    const confetti = e.type === "bot"
      ? [C.bot0, C.bot1, C.white, C.gold, C.botEye]
      : [C.spam0, C.spam2, C.spam3, C.heart, C.white, C.gold];
    burst(e.x + e.w / 2, e.y + e.h / 2, confetti, 16, 3);
    textPop(e.x, e.y - 6, e.type === "bot" ? "404" : "MUTED", C.gold);
    const base = e.type === "bot" ? 10 : 25;
    state.combo = state.comboTimer > 0 ? state.combo + 1 : 1;
    state.comboTimer = 90;
    const mult = Math.min(5, 1 + Math.floor((state.combo - 1) / 2));
    const pts = base * mult;
    state.score += pts;
    textPop(e.x + 2, e.y - 14, mult > 1 ? `+${pts} x${mult}` : `+${pts}`, C.ui);
    if (chance(0.18 + state.wave * 0.01)) dropPower(e.x + e.w / 2, e.y);
    enemies.splice(idx, 1);
    SFX.kill();
    state.shake = 4;
  }

  function dropPower(x, y) {
    const r = Math.random();
    const kind = r < 0.42 ? "rapid" : r < 0.8 ? "shield" : "nuke";
    powerups.push({ x: x - 6, y, w: 12, h: 12, vy: -2, onGround: false, kind, life: 420 });
  }

  function doNuke() {
    SFX.nuke();
    state.shake = 12;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      burst(e.x + e.w / 2, e.y + e.h / 2, C.conf, 18, 4);
      state.score += e.type === "bot" ? 10 : 25;
      enemies.splice(i, 1);
    }
    eBullets.length = 0;
    textPop(W / 2 - 24, H / 2 - 30, "NUKE!", C.gold);
    state.flashMsg = "SCREEN CLEARED!";
    state.flashTimer = 60;
  }

  function hurtPlayer() {
    if (state.invuln > 0) return;
    if (player.shield > 0) {
      player.shield = 0;
      state.invuln = 45;
      burst(player.x + 11, player.y + 12, [C.verified, C.verifiedLt, C.white], 10, 2.2);
      SFX.hit();
      return;
    }
    state.lives -= 1;
    state.invuln = 75;
    state.shake = 8;
    state.combo = 0;
    burst(player.x + 11, player.y + 12, [C.p1, C.cam1, C.white, C.rose], 12, 2.5);
    SFX.hurt();
    if (state.lives <= 0) {
      state.mode = "gameover";
      if (state.score > state.high) {
        state.high = state.score;
        localStorage.setItem(HS_KEY, String(state.high));
      }
      SFX.gameover();
    }
  }

  // ─── Update ───
  function update() {
    state.t++;
    if (state.mode === "title" || state.mode === "gameover" || state.mode === "pause") {
      if (state.mode === "title") state.bgScroll += 0.2;
      return;
    }

    if (state.flashTimer > 0) state.flashTimer--;
    if (state.comboTimer > 0) {
      state.comboTimer--;
      if (state.comboTimer <= 0) state.combo = 0;
    }
    if (state.invuln > 0) state.invuln--;
    if (state.shake > 0) state.shake--;
    if (shootCD > 0) shootCD--;
    if (player.rapid > 0) player.rapid--;
    if (player.shield > 0) player.shield--;
    if (player.shootT > 0) player.shootT--;

    state.bgScroll += 0.25;

    let move = 0;
    if (keys["ArrowLeft"] || keys["KeyA"]) move -= 1;
    if (keys["ArrowRight"] || keys["KeyD"]) move += 1;
    player.vx = move * 2.1;
    if (move !== 0) player.facing = move;

    const wantJump = keys["Space"] || keys["KeyW"] || keys["ArrowUp"];
    if (wantJump && player.onGround) {
      player.vy = -6.2;
      player.onGround = false;
      SFX.jump();
    }

    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;
    player.x = clamp(player.x, 4, W - player.w - 4);

    if (player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
    } else player.onGround = false;

    player.frameT++;
    if (player.shootT > 0) player.anim = "shoot";
    else if (!player.onGround) player.anim = "jump";
    else if (Math.abs(player.vx) > 0.1) player.anim = "run";
    else player.anim = "idle";
    if (player.frameT > (player.anim === "run" ? 5 : 14)) {
      player.frameT = 0;
      player.frame = (player.frame + 1) % 4;
    }

    if ((mouseDown || keys["KeyX"]) && state.mode === "play") shoot();

    if (state.mode === "play" && spawnQueue.length) {
      for (let i = spawnQueue.length - 1; i >= 0; i--) {
        spawnQueue[i].delay--;
        if (spawnQueue[i].delay <= 0) {
          spawnEnemy(spawnQueue[i].type);
          spawnQueue.splice(i, 1);
        }
      }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.frameT = (e.frameT || 0) + 1;
      if (e.frameT > 7) { e.frameT = 0; e.frame = ((e.frame || 0) + 1) % 2; }

      if (e.drop && e.y + e.h < GROUND_Y) {
        e.vy += GRAVITY * 0.55;
        e.y += e.vy;
        if (e.y + e.h >= GROUND_Y) {
          e.y = GROUND_Y - e.h;
          e.vy = 0;
          e.drop = false;
        }
      } else {
        const speed = e.type === "bot" ? 0.55 + state.wave * 0.05 : 0.85 + state.wave * 0.06;
        const dx = (player.x + player.w / 2) - (e.x + e.w / 2);
        e.facing = dx >= 0 ? 1 : -1;
        e.vx = Math.sign(dx) * speed;
        e.x += e.vx;
        e.y = GROUND_Y - e.h;
      }

      if (e.type === "spam") {
        e.shootT--;
        if (e.shootT <= 0 && !e.drop) {
          e.shootT = Math.max(32, 75 - state.wave * 4);
          const kinds = ["!!!", "♥", "f4f", "BOT"];
          const k = kinds[irand(0, kinds.length - 1)];
          const px = player.x + player.w / 2;
          const py = player.y + player.h / 2;
          const ex = e.x + e.w / 2;
          const ey = e.y + 4;
          let vx = px - ex, vy = py - ey;
          const len = Math.hypot(vx, vy) || 1;
          const sp = 1.55 + state.wave * 0.09;
          eBullets.push({
            x: ex - 4, y: ey, w: 9, h: 8,
            vx: (vx / len) * sp, vy: (vy / len) * sp,
            life: 130, kind: k,
          });
        }
      }

      if (rects(player, e) && state.invuln <= 0) hurtPlayer();
      if (e.x < -50 || e.x > W + 50) enemies.splice(i, 1);
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      if (b.life <= 0 || b.x < -12 || b.x > W + 12) { bullets.splice(i, 1); continue; }
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (rects(b, e)) {
          e.hp--;
          burst(b.x, b.y, [C.ban, C.mute, C.white, C.gold], 5, 1.8);
          bullets.splice(i, 1);
          SFX.hit();
          if (e.hp <= 0) killEnemy(e, j);
          break;
        }
      }
    }

    for (let i = eBullets.length - 1; i >= 0; i--) {
      const b = eBullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      if (b.life <= 0 || b.x < -12 || b.x > W + 12 || b.y > H) {
        eBullets.splice(i, 1);
        continue;
      }
      if (rects(b, player)) {
        eBullets.splice(i, 1);
        hurtPlayer();
      }
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.life--;
      if (!p.onGround) {
        p.vy += GRAVITY * 0.5;
        p.y += p.vy;
        if (p.y + p.h >= GROUND_Y) {
          p.y = GROUND_Y - p.h;
          p.vy = 0;
          p.onGround = true;
        }
      } else {
        p.bob = Math.sin(state.t * 0.14 + i) * 2;
      }
      if (p.life <= 0) { powerups.splice(i, 1); continue; }
      const hit = { x: p.x, y: p.y + (p.bob || 0), w: p.w, h: p.h };
      if (rects(player, hit)) {
        if (p.kind === "rapid") {
          player.rapid = 320;
          state.flashMsg = "RAPID FIRE!";
        } else if (p.kind === "shield") {
          player.shield = 380;
          state.flashMsg = "VERIFIED!";
        } else {
          doNuke();
          state.flashMsg = "BAN HAMMER!";
        }
        state.flashTimer = 50;
        SFX.pickup();
        SFX.power();
        burst(p.x + 6, p.y + 6, [C.gold, C.verified, C.white], 12, 2.2);
        powerups.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.06;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (state.mode === "play" && spawnQueue.length === 0 && enemies.length === 0) {
      state.mode = "wave";
      waveTimer = 110;
      state.flashMsg = WAVE_MSGS[irand(0, WAVE_MSGS.length - 1)];
      state.flashTimer = 100;
      state.score += 50 + state.wave * 10;
      SFX.wave();
    }
    if (state.mode === "wave") {
      waveTimer--;
      if (waveTimer <= 0) {
        state.wave++;
        state.mode = "play";
        beginWave();
      }
    }
  }

  // ─── Background (layered 16-bit desert) ───
  function drawSky() {
    // vertical bands for dithered sky feel
    const bands = [
      [0, 0.15, C.sky0],
      [0.15, 0.35, C.sky1],
      [0.35, 0.6, C.sky2],
      [0.6, 1, C.sky3],
    ];
    for (const [a, b, col] of bands) {
      rect(0, GROUND_Y * a, W, GROUND_Y * (b - a) + 1, col);
    }

    // sun with rim
    const sx = 400, sy = 32;
    rect(sx + 2, sy, 22, 22, C.sunRim);
    rect(sx, sy + 2, 26, 18, C.sunRim);
    rect(sx + 4, sy + 2, 18, 18, C.sun);
    rect(sx + 2, sy + 4, 22, 14, C.sun);
    // sun rays (pixel)
    fill(C.sunRim);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + state.t * 0.01;
      const x0 = sx + 13 + Math.cos(a) * 16;
      const y0 = sy + 11 + Math.sin(a) * 16;
      ctx.fillRect(x0 | 0, y0 | 0, 3, 2);
    }

    // far mountains
    const ox = -((state.bgScroll * 0.2) % 120);
    fill(C.mtFarDk);
    for (let i = -1; i < 6; i++) {
      const mx = ox + i * 100;
      const peak = 48 + (i % 3) * 10;
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y);
      ctx.lineTo(mx + 30, GROUND_Y - peak);
      ctx.lineTo(mx + 55, GROUND_Y - peak * 0.55);
      ctx.lineTo(mx + 80, GROUND_Y - peak * 0.85);
      ctx.lineTo(mx + 110, GROUND_Y);
      ctx.fill();
      // highlight ridge
      fill(C.mtFar);
      ctx.beginPath();
      ctx.moveTo(mx + 30, GROUND_Y - peak);
      ctx.lineTo(mx + 38, GROUND_Y - peak + 8);
      ctx.lineTo(mx + 30, GROUND_Y - peak + 14);
      ctx.fill();
      fill(C.mtFarDk);
    }

    // mid mountains
    const ox2 = -((state.bgScroll * 0.4) % 90);
    for (let i = -1; i < 8; i++) {
      const mx = ox2 + i * 78 + 20;
      const peak = 28 + (i % 4) * 7;
      fill(C.mtMidDk);
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y);
      ctx.lineTo(mx + 22, GROUND_Y - peak);
      ctx.lineTo(mx + 48, GROUND_Y - peak * 0.5);
      ctx.lineTo(mx + 70, GROUND_Y);
      ctx.fill();
      fill(C.mtMid);
      ctx.beginPath();
      ctx.moveTo(mx + 22, GROUND_Y - peak);
      ctx.lineTo(mx + 28, GROUND_Y - peak + 6);
      ctx.lineTo(mx + 22, GROUND_Y - peak + 12);
      ctx.fill();
    }

    // soft clouds
    fill("rgba(255,255,255,0.35)");
    const cox = -((state.bgScroll * 0.12) % 200);
    for (let i = 0; i < 4; i++) {
      const cx = cox + i * 140 + (i * 37) % 50;
      const cy = 28 + (i % 3) * 14;
      rect(cx, cy, 28, 6, "rgba(255,255,255,0.3)");
      rect(cx + 6, cy - 4, 18, 6, "rgba(255,255,255,0.35)");
      rect(cx + 10, cy + 3, 14, 4, "rgba(255,255,255,0.25)");
    }
  }

  function drawGround() {
    // dune band above ground line
    rect(0, GROUND_Y - 10, W, 10, C.dune);
    // highlight edge
    rect(0, GROUND_Y - 10, W, 2, C.duneLt);
    rect(0, GROUND_Y - 2, W, 2, C.duneDk);

    // sand body
    rect(0, GROUND_Y, W, H - GROUND_Y, C.sand);
    rect(0, GROUND_Y, W, 3, C.sandDk);

    // dithered sand texture
    for (let i = 0; i < 40; i++) {
      const x = ((i * 47 + state.bgScroll * 0.9) % (W + 30)) - 15;
      const y = GROUND_Y + 6 + (i * 13) % (H - GROUND_Y - 8);
      rect(x, y, 2 + (i % 3), 1, i % 2 ? C.sandLine : C.sandMid);
    }

    // rocky bits
    const rocks = [[50, 4], [140, 3], [260, 5], [350, 3], [430, 4]];
    for (const [bx, s] of rocks) {
      const x = ((bx - state.bgScroll * 0.7) % (W + 50) + W + 50) % (W + 50) - 25;
      rect(x, GROUND_Y - s, s + 3, s, C.rock);
      rect(x + 1, GROUND_Y - s - 1, s, s - 1, C.rockDk);
    }

    // bushes (multi-tone)
    const bushes = [[30, 6], [100, 5], [180, 7], [250, 4], [320, 6], [400, 5], [460, 7]];
    for (const [bx, s] of bushes) {
      const x = ((bx - state.bgScroll * 0.55) % (W + 60) + W + 60) % (W + 60) - 30;
      const y = GROUND_Y - s;
      rect(x + 1, y + 2, s + 2, s, C.bushDk);
      rect(x, y, s + 2, s, C.bush);
      rect(x + 1, y - 1, s, s - 1, C.bushLt);
      // tiny branches
      rect(x + s * 0.4, y - 3, 1, 3, C.bushDk);
    }
  }

  // ─── Entity drawing ───
  function drawPig(p) {
    const blink = state.invuln > 0 && Math.floor(state.t / 3) % 2 === 0;
    if (blink) return;

    let spr = sprIdle0;
    if (p.anim === "idle") spr = p.frame % 2 === 0 ? sprIdle0 : sprIdle1;
    else if (p.anim === "run") {
      const f = [sprRun0, sprRun1, sprRun2, sprRun3][p.frame % 4];
      spr = f;
    } else if (p.anim === "jump") spr = sprJump;
    else if (p.anim === "shoot") spr = sprShoot;

    const ox = (p.x | 0) - 2;
    const oy = (p.y | 0) - 0;
    const flip = p.facing < 0;

    // soft shadow
    ctx.fillStyle = C.shadow;
    ctx.fillRect(p.x + 4, GROUND_Y - 2, p.w - 4, 3);

    // verified aura
    if (p.shield > 0) {
      const pulse = 0.3 + 0.25 * Math.sin(state.t * 0.18);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = C.verified;
      ctx.fillRect(ox - 2, oy - 2, spr.w + 4, spr.h + 4);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = C.verifiedLt;
      ctx.fillRect(ox, oy, spr.w, 2);
      ctx.globalAlpha = 1;
      // badge
      rect(ox + (flip ? 0 : spr.w - 8), oy + 2, 7, 7, C.verified);
      rect(ox + (flip ? 1 : spr.w - 7), oy + 3, 5, 5, C.white);
      rect(ox + (flip ? 2 : spr.w - 6), oy + 4, 3, 3, C.verified);
    }

    spr.draw(ox, oy, flip);

    // rapid muzzle glow
    if (p.rapid > 0 && p.anim === "shoot") {
      const gx = flip ? ox - 2 : ox + spr.w - 2;
      rect(gx, oy + 12, 3, 3, C.goldLt);
    }
  }

  function drawBot(e) {
    const spr = (e.frame || 0) % 2 === 0 ? sprBot0 : sprBot1;
    const ox = (e.x | 0) - 1;
    const oy = (e.y | 0);
    ctx.fillStyle = C.shadow;
    ctx.fillRect(e.x + 1, GROUND_Y - 2, e.w - 1, 2);
    spr.draw(ox, oy, e.facing < 0);
  }

  function drawSpammer(e) {
    const spr = (e.frame || 0) % 2 === 0 ? sprSpam0 : sprSpam1;
    const ox = (e.x | 0) - 1;
    const oy = (e.y | 0);
    ctx.fillStyle = C.shadow;
    ctx.fillRect(e.x + 1, GROUND_Y - 2, e.w - 1, 2);
    // color flash outline
    if (Math.floor(state.t / 4) % 2 === 0) {
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = C.spam2;
      ctx.fillRect(ox - 1, oy - 1, spr.w + 2, spr.h + 2);
      ctx.globalAlpha = 1;
    }
    spr.draw(ox, oy, e.facing < 0);
  }

  function drawBanBullet(b) {
    const x = b.x | 0, y = b.y | 0;
    if (b.kind === "ban") {
      // ban hammer
      rect(x, y + 1, 8, 3, C.ban);
      rect(x + 1, y, 6, 5, C.ban);
      rect(x + 2, y + 1, 4, 3, C.banDk);
      rect(x + 3, y + 4, 2, 4, C.metal);
      rect(x + 2, y + 7, 4, 1, C.metalDk);
    } else {
      // mute icon
      rect(x, y + 2, 4, 4, C.mute);
      rect(x + 3, y, 3, 8, C.mute);
      rect(x + 1, y + 3, 2, 2, C.muteLt);
      rect(x + 7, y + 1, 2, 1, C.white);
      rect(x + 7, y + 3, 2, 1, C.white);
      rect(x + 7, y + 5, 2, 1, C.white);
    }
  }

  function drawEBullet(b) {
    const x = b.x | 0, y = b.y | 0;
    if (b.kind === "♥") {
      rect(x + 1, y, 3, 3, C.heart);
      rect(x + 5, y, 3, 3, C.heart);
      rect(x, y + 2, 9, 3, C.heart);
      rect(x + 1, y + 5, 7, 2, C.heart);
      rect(x + 3, y + 7, 3, 1, C.heart);
      rect(x + 2, y + 1, 1, 1, C.heartLt);
    } else {
      pxFont(8);
      const col = b.kind === "!!!" ? C.spam3 : b.kind === "f4f" ? C.spam2 : C.spam0;
      // outline
      fill(C.black);
      ctx.fillText(b.kind, x + 1, y + 1);
      fill(col);
      ctx.fillText(b.kind, x, y);
    }
  }

  function drawPower(p) {
    const x = (p.x | 0);
    const y = ((p.y + (p.bob || 0)) | 0);
    const pulse = Math.sin(state.t * 0.2) > 0;
    if (p.kind === "rapid") {
      rect(x, y, 12, 12, C.gold);
      rect(x + 1, y + 1, 10, 10, C.black);
      rect(x + 4, y + 2, 4, 8, C.gold);
      rect(x + 2, y + 4, 8, 3, C.goldLt);
    } else if (p.kind === "shield") {
      rect(x, y, 12, 12, C.verified);
      rect(x + 1, y + 1, 10, 10, C.white);
      rect(x + 3, y + 2, 6, 7, C.verified);
      rect(x + 5, y + 4, 2, 4, C.white);
    } else {
      rect(x, y, 12, 12, C.ban);
      rect(x + 1, y + 1, 10, 10, C.black);
      rect(x + 5, y + 1, 2, 10, C.gold);
      rect(x + 1, y + 5, 10, 2, C.gold);
      rect(x + 3, y + 3, 6, 6, C.goldLt);
    }
    if (pulse) rect(x - 1, y - 1, 14, 1, C.white);
  }

  function drawParticles() {
    for (const p of particles) {
      const a = clamp(p.life / 12, 0, 1);
      ctx.globalAlpha = a;
      if (p.text) {
        pxFont(9);
        fill(C.black);
        ctx.fillText(p.text, (p.x | 0) + 1, (p.y | 0) + 1);
        fill(p.col);
        ctx.fillText(p.text, p.x | 0, p.y | 0);
      } else {
        rect(p.x, p.y, p.size, p.size, p.col);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawMiniPig(x, y) {
    // life icon
    rect(x + 1, y + 2, 7, 6, C.p1);
    rect(x + 2, y, 5, 3, C.cam1);
    rect(x + 6, y + 3, 3, 2, C.snout);
    rect(x + 4, y + 3, 1, 1, C.black);
    rect(x + 2, y + 5, 2, 2, C.vest);
  }

  function drawUI() {
    // top bar panel
    rect(0, 0, W, 16, "rgba(16,12,8,0.55)");
    rect(0, 15, W, 1, "rgba(200,160,80,0.35)");

    pxFont(11);
    fill(C.ui);
    ctx.fillText(`SCORE ${state.score}`, 8, 3);
    ctx.fillText(`WAVE ${state.wave}`, 180, 3);
    fill(C.uiDim);
    ctx.fillText(`HI ${state.high}`, 280, 3);

    for (let i = 0; i < state.lives; i++) drawMiniPig(420 + i * 16, 3);

    if (state.combo >= 2) {
      pxFont(10);
      fill(C.gold);
      ctx.fillText(`COMBO x${Math.min(5, 1 + Math.floor((state.combo - 1) / 2))}`, 8, 20);
    }

    let px = 8;
    if (player && player.rapid > 0) {
      fill(C.gold);
      pxFont(8);
      ctx.fillText(`RAPID ${Math.ceil(player.rapid / 60)}s`, px, H - 14);
      px += 70;
    }
    if (player && player.shield > 0) {
      fill(C.verifiedLt);
      pxFont(8);
      ctx.fillText(`VERIFIED ${Math.ceil(player.shield / 60)}s`, px, H - 14);
    }

    if (state.flashTimer > 0 && state.flashMsg) {
      pxFont(14);
      const tw = ctx.measureText(state.flashMsg).width;
      const alpha = state.flashTimer < 15 ? state.flashTimer / 15 : 1;
      ctx.globalAlpha = alpha;
      fill("rgba(10,8,4,0.55)");
      ctx.fillRect((W - tw) / 2 - 10, 70, tw + 20, 22);
      fill(C.goldLt);
      ctx.fillText(state.flashMsg, (W - tw) / 2, 76);
      ctx.globalAlpha = 1;
    }
  }

  function drawTitle() {
    drawSky();
    drawGround();

    // showcase pig
    if (!player) resetEntities();
    player.x = W / 2 - PIG_W / 2;
    player.y = GROUND_Y - PIG_H;
    player.facing = 1;
    player.anim = Math.floor(state.t / 40) % 2 === 0 ? "idle" : "shoot";
    player.frame = Math.floor(state.t / 12) % 4;
    player.shootT = player.anim === "shoot" ? 5 : 0;
    player.shield = 0;
    drawPig(player);

    // decorative enemies on sides
    sprBot0.draw(40, GROUND_Y - 12, false);
    sprSpam0.draw(W - 55, GROUND_Y - 12, true);

    // title plate
    rect(70, 36, 340, 68, "rgba(16,12,6,0.7)");
    rect(72, 38, 336, 64, "rgba(80,60,24,0.35)");
    rect(70, 36, 340, 2, C.cam1);
    rect(70, 102, 340, 2, C.cam3);

    pxFont(22);
    fill(C.p1);
    ctx.fillText("PIG COMMANDO", 130, 48);
    // outline-ish second pass
    fill(C.p0);
    ctx.fillText("PIG COMMANDO", 129, 47);

    pxFont(11);
    fill(C.camGlt);
    ctx.fillText("VS BOTS & SPAMMERS", 158, 72);
    pxFont(8);
    fill(C.gold);
    ctx.fillText("X COMMANDO  ·  ELITE PLATFORM CLEANUP UNIT", 108, 88);

    pxFont(11);
    if (Math.floor(state.t / 28) % 2 === 0) {
      fill(C.ui);
      ctx.fillText("PRESS ANY KEY TO START", 148, 130);
    }

    pxFont(8);
    fill(C.uiDim);
    ctx.fillText("ARROWS / A D  MOVE   ·   SPACE JUMP   ·   CLICK / X  BAN", 78, 155);
    ctx.fillText(`HIGH SCORE  ${state.high}`, 188, 175);
  }

  function drawGameOver() {
    fill("rgba(8,6,4,0.75)");
    ctx.fillRect(0, 0, W, H);

    rect(90, 48, 300, 150, "rgba(24,18,10,0.92)");
    rect(92, 50, 296, 146, "rgba(70,52,24,0.4)");
    rect(90, 48, 300, 3, C.ban);

    pxFont(20);
    fill(C.ban);
    ctx.fillText("GAME OVER", 168, 64);

    pxFont(10);
    fill(C.ui);
    ctx.fillText("The algorithm won this round...", 130, 96);
    ctx.fillText("try again, Commando Pig!", 148, 112);

    pxFont(14);
    fill(C.gold);
    ctx.fillText(`SCORE  ${state.score}`, 178, 138);
    pxFont(10);
    fill(C.uiDim);
    ctx.fillText(`BEST  ${state.high}`, 198, 158);

    if (Math.floor(state.t / 24) % 2 === 0) {
      pxFont(11);
      fill(C.green);
      ctx.fillText("[ ENTER / CLICK TO RESTART ]", 130, 176);
    }
  }

  function drawPause() {
    fill("rgba(0,0,0,0.5)");
    ctx.fillRect(0, 0, W, H);
    pxFont(18);
    fill(C.ui);
    ctx.fillText("PAUSED", 198, 118);
    pxFont(10);
    fill(C.uiDim);
    ctx.fillText("P TO RESUME", 192, 145);
  }

  function render() {
    ctx.save();
    if (state.shake > 0) {
      ctx.translate(irand(-2, 2), irand(-2, 2));
    }

    if (state.mode === "title") {
      drawTitle();
      ctx.restore();
      return;
    }

    drawSky();
    drawGround();

    for (const p of powerups) drawPower(p);
    for (const e of enemies) {
      if (e.type === "bot") drawBot(e);
      else drawSpammer(e);
    }
    for (const b of eBullets) drawEBullet(b);
    for (const b of bullets) drawBanBullet(b);
    if (player) drawPig(player);
    drawParticles();
    drawUI();

    if (state.mode === "gameover") drawGameOver();
    if (state.mode === "pause") drawPause();

    ctx.restore();
  }

  // ─── Loop ───
  let last = performance.now();
  let acc = 0;
  const STEP = 1000 / 60;

  function frame(now) {
    acc += Math.min(100, now - last);
    last = now;
    while (acc >= STEP) {
      update();
      acc -= STEP;
    }
    render();
    requestAnimationFrame(frame);
  }

  resetEntities();
  state.mode = "title";
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
