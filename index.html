<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PIG COMMANDO 3D — X Office Purge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111;
    font-family: "Courier New", Courier, monospace; user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff;
    text-shadow: 2px 2px 0 #000; letter-spacing: 0.06em; }
  .hudBox { position: absolute; font-weight: bold; }
  #score { top: 12px; left: 16px; font-size: 20px; }
  #wave  { top: 12px; left: 50%; transform: translateX(-50%); font-size: 20px; text-align: center; }
  #weapon{ top: 12px; right: 16px; font-size: 18px; text-align: right; }
  #lives { top: 44px; left: 16px; font-size: 22px; }
  #chargeWrap { bottom: 18px; left: 50%; transform: translateX(-50%); width: 220px; text-align: center; }
  #chargeLabel { font-size: 12px; margin-bottom: 4px; }
  #chargeBar { width: 100%; height: 10px; border: 2px solid #fff; background: rgba(0,0,0,0.5); }
  #chargeFill { height: 100%; width: 0%; background: #6cf; }
  #msg { top: 34%; left: 50%; transform: translate(-50%,-50%); width: 100%; text-align: center;
    font-size: 44px; color: #ffd94a; -webkit-text-stroke: 2px #000; }
  #crosshair { top: 50%; left: 50%; transform: translate(-50%,-50%); color: #4ff; font-size: 22px; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(6,8,14,0.82); color: #fff; text-align: center; cursor: pointer;
    overflow: hidden; isolation: isolate; }
  #overlay h1 { font-size: 52px; color: #ffb6c6; -webkit-text-stroke: 2px #000; margin-bottom: 12px; }
  #overlay p { font-size: 16px; line-height: 1.7; color: #cfd6e0; }
  #overlay .go { color: #ffd94a; font-size: 26px; margin-top: 18px; }
  #overlay.death-weekend h1 { color: #ff4a4a; font-size: 44px; }
  #overlay.death-sleep { background: rgba(12, 8, 28, 0.92) !important; }
  #overlay.death-sleep h1 { color: #c9a0ff; font-size: 40px; text-shadow: 0 0 20px rgba(180,120,255,0.5); }
  #overlay.death-sleep .death-sub { color: #e8d8ff; font-size: 22px; max-width: 560px; margin: 12px auto; line-height: 1.45; }
  /* —— WINDOW ESCAPE: full-screen cinematic death —— */
  #overlay.death-escape {
    background: #000 !important;
    justify-content: flex-end;
    align-items: center;
    padding: 0 4vw 5vh;
    overflow: hidden;
  }
  #overlay.death-escape .escape-stage {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: #000;
  }
  #overlay.death-escape .escape-stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    animation: escapeKen 8s ease-out forwards;
    filter: contrast(1.08) saturate(1.1);
  }
  #overlay.death-escape .escape-veil {
    position: absolute; inset: 0;
    background: linear-gradient(
      to top,
      rgba(0,0,0,0.92) 0%,
      rgba(0,0,0,0.55) 28%,
      rgba(0,0,0,0.2) 55%,
      rgba(0,0,0,0.35) 100%
    );
    pointer-events: none;
  }
  #overlay.death-escape .escape-flash {
    position: absolute; inset: 0;
    background: #000;
    animation: escapeFlash 0.9s ease-out forwards;
    pointer-events: none;
    z-index: 2;
  }
  #overlay.death-escape h1,
  #overlay.death-escape p,
  #overlay.death-escape .go {
    position: relative;
    z-index: 3;
  }
  #overlay.death-escape h1 {
    color: #7cffb0;
    font-size: clamp(34px, 7vw, 56px);
    text-shadow: 0 0 24px rgba(0,0,0,1), 0 4px 0 #000, 0 0 40px rgba(124,255,176,0.35);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
    animation: escapeTextIn 0.7s ease-out 0.35s both;
  }
  #overlay.death-escape p {
    color: #e8eef8;
    text-shadow: 0 2px 10px #000;
    animation: escapeTextIn 0.7s ease-out 0.5s both;
  }
  #overlay.death-escape .go {
    animation: escapeTextIn 0.7s ease-out 0.7s both;
  }
  #overlay .death-sub {
    font-size: clamp(18px, 3.4vw, 26px);
    color: #ffe08a;
    margin: 12px auto 18px;
    max-width: min(560px, 92vw);
    line-height: 1.45;
    font-weight: 700;
  }
  @keyframes escapeFlash {
    0% { opacity: 1; }
    35% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes escapeKen {
    0% { transform: scale(1.2) translateY(-6%); opacity: 0.4; }
    20% { opacity: 1; }
    100% { transform: scale(1.0) translateY(4%); opacity: 1; }
  }
  @keyframes escapeTextIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hidden { display: none !important; }
  #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(255,0,0,0.55) 100%); }
  /* ===== MOBILE TOUCH CONTROLS ===== */
function showMobileUI(on) {
  const ui = $("mobileUI");
  if (!ui) return;
  if (on && isMobile()) {
    ui.classList.add("show");
    ui.setAttribute("aria-hidden", "false");
    document.body.style.touchAction = "none";
  } else {
    ui.classList.remove("show");
    ui.setAttribute("aria-hidden", "true");
    touchMove.x = touchMove.y = 0;
    touchMove.active = false;
  }
}
(function () {
  if (!isMobile()) return;
  document.querySelectorAll(".deskCtrl").forEach(n => { n.style.display = "none"; });
  document.querySelectorAll(".mobCtrl").forEach(n => { n.style.display = "inline"; });
  const go = $("overlayGo");
  if (go) go.textContent = "TAP TO ENLIST";
})();

function bindMobileControls() {
  const stickZone = $("stickZone");
  const stickKnob = $("stickKnob");
  const stickBase = $("stickBase");
  const lookZone = $("lookZone");
  if (!stickZone || !lookZone || !stickBase) return;
  const R = 42;

  const setKnob = (nx, ny) => {
    if (stickKnob) stickKnob.style.transform = `translate(${nx * R}px, ${ny * R}px)`;
  };

  stickZone.addEventListener("touchstart", (e) => {
    if (mode !== "play") return;
    stickTouchId = e.changedTouches[0].identifier;
    touchMove.active = true;
    e.preventDefault();
  }, { passive: false });

  stickZone.addEventListener("touchmove", (e) => {
    if (mode !== "play") return;
    let t = null;
    for (const x of e.changedTouches) if (x.identifier === stickTouchId) t = x;
    if (!t) return;
    const rect = stickBase.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    let dx = (t.clientX - cx) / R, dy = (t.clientY - cy) / R;
    const len = Math.hypot(dx, dy) || 1;
    if (len > 1) { dx /= len; dy /= len; }
    touchMove.x = dx; touchMove.y = dy;
    setKnob(dx, dy);
    e.preventDefault();
  }, { passive: false });

  const endStick = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouchId) {
        stickTouchId = null;
        touchMove.x = touchMove.y = 0;
        touchMove.active = false;
        setKnob(0, 0);
      }
    }
  };
  stickZone.addEventListener("touchend", endStick);
  stickZone.addEventListener("touchcancel", endStick);

  lookZone.addEventListener("touchstart", (e) => {
    if (mode !== "play") return;
    if (e.target.closest && e.target.closest(".mbtn")) return;
    const t = e.changedTouches[0];
    lookTouchId = t.identifier;
    lookZone._prev = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });

  lookZone.addEventListener("touchmove", (e) => {
    if (mode !== "play") return;
    let t = null;
    for (const x of e.changedTouches) if (x.identifier === lookTouchId) t = x;
    if (!t) return;
    const prev = lookZone._prev || { x: t.clientX, y: t.clientY };
    const mx = t.clientX - prev.x, my = t.clientY - prev.y;
    lookZone._prev = { x: t.clientX, y: t.clientY };
    yaw -= mx * 0.0055;
    pitch = Math.max(0.05, Math.min(1.1, pitch + my * 0.004));
    e.preventDefault();
  }, { passive: false });

  const endLook = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouchId) {
        lookTouchId = null;
        lookZone._prev = null;
      }
    }
  };
  lookZone.addEventListener("touchend", endLook);
  lookZone.addEventListener("touchcancel", endLook);

  const hold = (el, onDown, onUp) => {
    if (!el) return;
    const down = (e) => { e.preventDefault(); el.classList.add("held"); onDown && onDown(e); };
    const up = (e) => { el.classList.remove("held"); onUp && onUp(e); };
    el.addEventListener("touchstart", down, { passive: false });
    el.addEventListener("touchend", up);
    el.addEventListener("touchcancel", up);
  };

  hold($("mJump"), () => { keys.Space = true; keys.KeyJ = true; }, () => { keys.Space = false; keys.KeyJ = false; });
  hold($("mBoom"), () => {
    weaponIdx = 0;
    if ($("weaponV")) $("weaponV").textContent = "X BOOMERANG";
    throwBoomerang(0.9);
  });
  hold($("mRifle"), () => {
    weaponIdx = 1;
    if ($("weaponV")) $("weaponV").textContent = "DEMONETIZER";
    fireRifle();
    mobileFireHeld = true;
  }, () => { mobileFireHeld = false; });
  hold($("mSwap"), () => {
    weaponIdx = 1 - weaponIdx;
    if ($("weaponV")) $("weaponV").textContent = weaponIdx ? "DEMONETIZER" : "X BOOMERANG";
    if ($("chargeLabel")) $("chargeLabel").textContent = weaponIdx ? "LOCK-ON" : "X CHARGE";
  });
}
bindMobileControls();
setInterval(() => {
  if (mode === "play" && mobileFireHeld && weaponIdx === 1) fireRifle();
}, 160);

window.__game = { startGame, throwBoomerang, fireRifle, doPurge, gameOver, triggerEscape, keys, get enemies() { return enemies; }, get pig() { return pig; }, isMobile };
window.__cam = camera;
window.__renderer = renderer;
window.__scene = scene;
</script>
</body>
</html>
