name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Commits pushed by a workflow using GITHUB_TOKEN do NOT raise a `push` event,
  # so patch-applying workflows would land code that never deployed. Redeploy
  # after they finish. Add new bot workflows to this list.
  workflow_run:
    workflows: ["Apply hide-on-read patch"]
    types: [completed]
  # Safety net: if anything still slips through, publish current main hourly.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
