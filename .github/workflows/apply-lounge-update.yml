name: Apply lounge-update patch
on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/lounge-update.patch'
      - '.github/workflows/apply-lounge-update.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          if [ -f patches/lounge-update.patch ]; then
            patch -p1 --forward < patches/lounge-update.patch || {
              echo "Patch may already be applied; checking..."
              grep -q 'buildLoungeHero' index.html && echo "Already applied" && exit 0
              exit 1
            }
          fi
          cp index.html game.html
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html game.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Apply lounge-update: social lounge UI, hero, mobile controls"
            git push
          fi
