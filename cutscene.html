<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache" />
<title>Fa'tidiot — Starbase Escape Cutscene</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060c;
    font-family: system-ui, -apple-system, sans-serif; color: #e8eef8; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
  }
  #caption {
    position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: min(420px, calc(100vw - 32px));
    text-align: center;
    font: 500 13px/1.4 system-ui, sans-serif;
    color: rgba(236, 240, 248, 0.92);
    background: rgba(10, 12, 18, 0.88);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 16px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #caption.show { opacity: 1; }
  #bar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
    pointer-events: auto;
  }
  #bar h1 {
    font: 700 13px/1.2 system-ui; letter-spacing: 0.12em; text-transform: uppercase;
    color: #8fd1ff;
  }
  #bar .acts {
    font: 500 11px/1 system-ui; color: rgba(255,255,255,0.45);
    letter-spacing: 0.04em;
  }
  #controls {
    position: absolute; top: 14px; right: 14px;
    display: flex; gap: 8px; pointer-events: auto;
  }
  #controls a, #controls button {
    appearance: none; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(12,14,22,0.75); color: #e8eef8;
    font: 600 12px/1 system-ui; padding: 8px 12px; border-radius: 8px;
    cursor: pointer; text-decoration: none;
  }
  #controls a:hover, #controls button:hover {
    border-color: rgba(143,209,255,0.5); color: #8fd1ff;
  }
  #end {
    position: fixed; inset: 0; z-index: 20;
    display: none; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 4vw 8vh; text-align: center;
    background: radial-gradient(ellipse at 40% 30%, #1a3060 0%, #05060c 70%);
  }
  #end.show { display: flex; }
  #end h2 {
    font: 800 clamp(28px, 6vw, 48px)/1.1 system-ui;
    color: #7cffb0; letter-spacing: 0.04em;
    text-shadow: 0 0 30px rgba(124,255,176,0.35), 0 4px 0 #000;
    margin-bottom: 10px;
  }
  #end p { font: 500 15px/1.5 system-ui; color: #cfd6e0; max-width: 480px; margin-bottom: 8px; }
  #end .mars { color: #8fd1ff; font-weight: 700; margin-bottom: 22px; }
  #end .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #end button, #end a {
    appearance: none; border: 1px solid rgba(124,255,176,0.35);
    background: rgba(12,20,18,0.85); color: #7cffb0;
    font: 700 13px/1 system-ui; padding: 12px 18px; border-radius: 10px;
    cursor: pointer; text-decoration: none;
  }
  #letterbox t, #letterbox b {
    position: fixed; left: 0; right: 0; height: 8vh; background: #000; z-index: 5;
    pointer-events: none;
  }
  #letterbox t { top: 0; }
  #letterbox b { bottom: 0; }
  @media (max-width: 600px) {
    #bar h1 { font-size: 11px; }
    #controls { top: auto; bottom: max(70px, env(safe-area-inset-bottom)); right: 12px; flex-direction: column; }
  }
</style>
</head>
<body>
<div id="letterbox"><t></t><b></b></div>
<div id="ui">
  <div id="bar">
    <div>
      <h1>Starbase Escape</h1>
      <div class="acts" id="actLabel">Close-up</div>
    </div>
  </div>
  <div id="controls">
    <button type="button" id="btnReplay">Replay</button>
    <a href="./">Full game</a>
  </div>
  <div id="caption"></div>
</div>
<div id="end">
  <h2>LIFTOFF — YOU ESCAPED X</h2>
  <p>Helmet sealed. Fist raised. Message delivered.<br>The pad burns behind you.</p>
  <div class="mars">Starship clear of Starbase · Mars on the horizon</div>
  <div class="btns">
    <button type="button" id="btnAgain">Watch again</button>
    <a href="./">Enter the game</a>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

const $ = (id) => document.getElementById(id);
const captionEl = $("caption");
const actLabel = $("actLabel");
const endEl = $("end");

function cap(text) {
  captionEl.textContent = text || "";
  captionEl.classList.toggle("show", !!text);
}
function act(name) { actLabel.textContent = name; }

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0618);
scene.fog = new THREE.Fog(0x0a0618, 35, 140);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 1.6, 12);

const hemi = new THREE.HemisphereLight(0x6a80c0, 0x1a1010, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc090, 1.1);
sun.position.set(-20, 40, 10);
scene.add(sun);
const padLight = new THREE.PointLight(0xff6a20, 40, 50);
padLight.position.set(0, 8, 0);
scene.add(padLight);
const fill = new THREE.PointLight(0x6090ff, 18, 40);
fill.position.set(8, 6, 14);
scene.add(fill);

/* —— ground / pad —— */
{
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(80, 48),
    new THREE.MeshLambertMaterial({ color: 0x1a1820 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  const pad = new THREE.Mesh(
    new THREE.CircleGeometry(18, 40),
    new THREE.MeshLambertMaterial({ color: 0x2a2e38 })
  );
  pad.rotation.x = -Math.PI / 2;
  pad.position.y = 0.02;
  scene.add(pad);
  /* grid lines on pad */
  for (let i = -4; i <= 4; i++) {
    const a = new THREE.Mesh(new THREE.BoxGeometry(16, 0.03, 0.08), new THREE.MeshBasicMaterial({ color: 0x3a4050 }));
    a.position.set(0, 0.04, i * 2.2);
    scene.add(a);
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.03, 16), new THREE.MeshBasicMaterial({ color: 0x3a4050 }));
    b.position.set(i * 2.2, 0.04, 0);
    scene.add(b);
  }
}

/* —— distant HQ block —— */
{
  const hq = new THREE.Mesh(
    new THREE.BoxGeometry(40, 18, 14),
    new THREE.MeshLambertMaterial({ color: 0x141820 })
  );
  hq.position.set(0, 9, -42);
  scene.add(hq);
  for (let i = 0; i < 20; i++) {
    const w = new THREE.Mesh(
      new THREE.PlaneGeometry(1.2, 1.6),
      new THREE.MeshBasicMaterial({ color: Math.random() > 0.4 ? 0xffe0a0 : 0x4060a0 })
    );
    w.position.set(-16 + (i % 10) * 3.4, 4 + Math.floor(i / 10) * 6, -34.9);
    scene.add(w);
  }
  /* starbase name plate */
  const canvas = document.createElement("canvas");
  canvas.width = 512; canvas.height = 96;
  const g = canvas.getContext("2d");
  g.fillStyle = "#0a0e18"; g.fillRect(0, 0, 512, 96);
  g.fillStyle = "#7cffb0"; g.font = "bold 42px system-ui"; g.textAlign = "center";
  g.fillText("STARBASE HQ", 256, 58);
  const tex = new THREE.CanvasTexture(canvas);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(14, 2.6), new THREE.MeshBasicMaterial({ map: tex }));
  sign.position.set(0, 16, -34.8);
  scene.add(sign);
}

/* —— rocket —— */
function buildRocket() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(1.6, 1.9, 22, 16),
    new THREE.MeshLambertMaterial({ color: 0xd8dde8, flatShading: true })
  );
  body.position.y = 12;
  g.add(body);
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(1.6, 4.5, 16),
    new THREE.MeshLambertMaterial({ color: 0xc0c6d4, flatShading: true })
  );
  nose.position.y = 25.2;
  g.add(nose);
  /* fins */
  for (let i = 0; i < 4; i++) {
    const fin = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 3.2, 2.4),
      new THREE.MeshLambertMaterial({ color: 0x9aa3b5, flatShading: true })
    );
    const a = (i / 4) * Math.PI * 2;
    fin.position.set(Math.cos(a) * 1.7, 2.2, Math.sin(a) * 1.7);
    fin.rotation.y = -a;
    g.add(fin);
  }
  /* black stripe */
  const stripe = new THREE.Mesh(
    new THREE.CylinderGeometry(1.62, 1.92, 1.2, 16),
    new THREE.MeshLambertMaterial({ color: 0x1a1c22, flatShading: true })
  );
  stripe.position.y = 8;
  g.add(stripe);
  /* hatch glow */
  const hatch = new THREE.Mesh(
    new THREE.PlaneGeometry(1.4, 2.2),
    new THREE.MeshBasicMaterial({ color: 0xffaa60, transparent: true, opacity: 0.55 })
  );
  hatch.position.set(0, 3.2, 1.95);
  g.add(hatch);
  g.userData.hatch = hatch;
  /* engine plume (hidden until launch) */
  const plume = new THREE.Group();
  for (let i = 0; i < 6; i++) {
    const c = new THREE.Mesh(
      new THREE.ConeGeometry(1.1 + i * 0.35, 3.2 + i * 1.1, 8),
      new THREE.MeshBasicMaterial({
        color: [0xff6a00, 0xffaa00, 0xff3300, 0xffe080, 0xff5020, 0xffcc40][i],
        transparent: true, opacity: 0.7
      })
    );
    c.position.y = -1.5 - i * 1.0;
    c.rotation.x = Math.PI;
    plume.add(c);
  }
  plume.visible = false;
  g.add(plume);
  g.userData.plume = plume;
  g.position.set(0, 0, 0);
  return g;
}
const rocket = buildRocket();
scene.add(rocket);

/* —— Mars in sky —— */
const mars = new THREE.Mesh(
  new THREE.SphereGeometry(3.4, 28, 18),
  new THREE.MeshBasicMaterial({ color: 0xc45a32 })
);
mars.position.set(26, 38, -52);
const maria = new THREE.Mesh(
  new THREE.SphereGeometry(3.45, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0x8a3a22, transparent: true, opacity: 0.35 })
);
maria.scale.set(0.7, 0.5, 0.8);
mars.add(maria);
scene.add(mars);

/* —— stars —— */
{
  const positions = new Float32Array(900);
  for (let i = 0; i < 300; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 200;
    positions[i * 3 + 1] = 20 + Math.random() * 80;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 200;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));
}

/* —— battlefield corpses —— */
function spawnCorpses() {
  const group = new THREE.Group();
  for (let i = 0; i < 16; i++) {
    const g = new THREE.Group();
    if (i % 3 === 0) {
      const tin = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.45, 0.7, 12),
        new THREE.MeshLambertMaterial({ color: 0x04246b, flatShading: true })
      );
      tin.rotation.z = Math.PI / 2;
      tin.position.y = 0.35;
      g.add(tin);
    } else {
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 0.35, 1.1),
        new THREE.MeshLambertMaterial({ color: [0x3a4050, 0x2a3040, 0x4a3020][i % 3], flatShading: true })
      );
      body.position.y = 0.25;
      body.rotation.z = (Math.random() - 0.5) * 0.8;
      body.rotation.y = Math.random() * Math.PI * 2;
      g.add(body);
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 8, 8),
        new THREE.MeshLambertMaterial({ color: 0x1a1e28, flatShading: true })
      );
      head.position.set((Math.random() - 0.5) * 0.3, 0.35, 0.55);
      g.add(head);
      const stain = new THREE.Mesh(
        new THREE.CircleGeometry(0.5 + Math.random() * 0.4, 10),
        new THREE.MeshBasicMaterial({ color: 0x1a0808, transparent: true, opacity: 0.5 })
      );
      stain.rotation.x = -Math.PI / 2;
      stain.position.y = 0.03;
      g.add(stain);
    }
    const ang = (i / 16) * Math.PI * 2;
    const dist = 7 + Math.random() * 12;
    g.position.set(Math.cos(ang) * dist, 0, Math.sin(ang) * dist + 6 + Math.random() * 6);
    g.rotation.y = Math.random() * Math.PI * 2;
    group.add(g);
  }
  scene.add(group);
  return group;
}
const corpses = spawnCorpses();

/* —— spacesuit hero —— */
function buildHero() {
  const g = new THREE.Group();
  const WHITE = 0xe8eef4, WHITE2 = 0xc8d0dc, ORANGE = 0xff6a20, NAVY = 0x1a2840;
  const torso = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 0.62, 0.95, 14),
    new THREE.MeshLambertMaterial({ color: WHITE, flatShading: true })
  );
  torso.position.y = 0.95;
  g.add(torso);
  const chest = new THREE.Mesh(
    new THREE.BoxGeometry(0.85, 0.55, 0.35),
    new THREE.MeshLambertMaterial({ color: WHITE2, flatShading: true })
  );
  chest.position.set(0, 1.05, 0.35);
  g.add(chest);
  for (const y of [0.7, 1.15]) {
    const s = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 0.06, 0.72),
      new THREE.MeshLambertMaterial({ color: ORANGE, flatShading: true })
    );
    s.position.set(0, y, 0.05);
    g.add(s);
  }
  const pack = new THREE.Mesh(
    new THREE.BoxGeometry(0.55, 0.7, 0.35),
    new THREE.MeshLambertMaterial({ color: WHITE2, flatShading: true })
  );
  pack.position.set(0, 1.1, -0.45);
  g.add(pack);
  for (const s of [-1, 1]) {
    const leg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.16, 0.18, 0.7, 10),
      new THREE.MeshLambertMaterial({ color: WHITE, flatShading: true })
    );
    leg.position.set(0.22 * s, 0.35, 0.05);
    g.add(leg);
    const boot = new THREE.Mesh(
      new THREE.BoxGeometry(0.28, 0.12, 0.36),
      new THREE.MeshLambertMaterial({ color: NAVY, flatShading: true })
    );
    boot.position.set(0.22 * s, 0.06, 0.08);
    g.add(boot);
  }
  for (const s of [-1, 1]) {
    const arm = new THREE.Group();
    const upper = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.13, 0.55, 8),
      new THREE.MeshLambertMaterial({ color: WHITE, flatShading: true })
    );
    arm.add(upper);
    const glove = new THREE.Mesh(
      new THREE.SphereGeometry(0.14, 8, 8),
      new THREE.MeshLambertMaterial({ color: ORANGE, flatShading: true })
    );
    glove.position.y = -0.35;
    arm.add(glove);
    arm.position.set(0.62 * s, 1.15, 0.1);
    arm.rotation.z = 0.35 * s;
    g.add(arm);
    if (s < 0) g.userData.armL = arm; else g.userData.armR = arm;
  }
  /* head under helmet ring */
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 12, 10),
    new THREE.MeshLambertMaterial({ color: 0xd9a583, flatShading: true })
  );
  head.position.set(0, 1.55, 0.08);
  g.add(head);
  g.userData.head = head;
  /* helmet */
  const helm = new THREE.Group();
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(0.38, 16, 12),
    new THREE.MeshLambertMaterial({ color: WHITE, flatShading: true })
  );
  helm.add(dome);
  const visor = new THREE.Mesh(
    new THREE.SphereGeometry(0.32, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.55),
    new THREE.MeshBasicMaterial({ color: 0xc9a24a, transparent: true, opacity: 0.75 })
  );
  visor.position.set(0, -0.02, 0.18);
  visor.rotation.x = 0.35;
  helm.add(visor);
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(0.34, 0.04, 8, 20),
    new THREE.MeshLambertMaterial({ color: NAVY, flatShading: true })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = -0.18;
  helm.add(rim);
  helm.position.set(-0.55, 0.85, 0.35);
  helm.scale.setScalar(0.85);
  g.add(helm);
  g.userData.helmet = helm;
  /* neck ring */
  const neck = new THREE.Mesh(
    new THREE.TorusGeometry(0.22, 0.05, 8, 16),
    new THREE.MeshLambertMaterial({ color: NAVY, flatShading: true })
  );
  neck.rotation.x = Math.PI / 2;
  neck.position.set(0, 1.45, 0.05);
  g.add(neck);
  return g;
}
const hero = buildHero();
scene.add(hero);

/* emoji sprites for fist / finger */
function emojiSprite(char, size = 128) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.font = `${size * 0.72}px serif`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(char, size / 2, size / 2 + 4);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(1.2, 1.2, 1);
  sp.visible = false;
  scene.add(sp);
  return sp;
}
const fistSpr = emojiSprite("✊");
const fingerSpr = emojiSprite("🖕");

/* —— timeline —— */
const T = {
  CLOSE: 2.6,
  WALK: 8.0,
  HELM: 10.2,
  APPROACH: 12.0,
  TURN: 15.2,
  FIST: 17.2,
  FINGER: 20.2,
  ENTER: 22.4,
  IGNITE: 23.2,
  VICTORY: 34.0,
};

const walkFrom = new THREE.Vector3(2.2, 0, 14);
const walkTo = new THREE.Vector3(0.4, 0, 4.2);
const hatch = new THREE.Vector3(0.2, 0, 2.6);
const door = new THREE.Vector3(0, 0.4, 0.6);

let t = 0;
let playing = true;
let said = {};
let shake = 0;
const clock = new THREE.Clock();

function smooth(a, b, u) {
  const k = u * u * (3 - 2 * u);
  return a + (b - a) * k;
}
function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function reset() {
  t = 0;
  playing = true;
  said = {};
  shake = 0;
  hero.visible = true;
  hero.scale.setScalar(1);
  hero.position.copy(walkFrom);
  hero.rotation.set(0, Math.PI, 0);
  const helm = hero.userData.helmet;
  helm.position.set(-0.55, 0.85, 0.35);
  helm.scale.setScalar(0.85);
  helm.rotation.set(0.15, 0.4, 0.2);
  hero.userData.head.visible = true;
  rocket.position.set(0, 0, 0);
  rocket.userData.plume.visible = false;
  rocket.rotation.set(0, 0, 0);
  fistSpr.visible = false;
  fingerSpr.visible = false;
  camera.fov = 42;
  camera.updateProjectionMatrix();
  camera.position.set(walkFrom.x + 0.4, 1.55, walkFrom.z + 2.4);
  endEl.classList.remove("show");
  cap("Your ride home");
  act("Close-up");
  padLight.intensity = 40;
}

function update(dt) {
  if (!playing) return;
  t += dt;
  const helm = hero.userData.helmet;
  const armL = hero.userData.armL;
  const armR = hero.userData.armR;

  if (t < T.CLOSE) {
    act("Close-up");
    if (!said.close) { said.close = true; cap("Your ride home"); }
    hero.position.copy(walkFrom);
    hero.rotation.y = Math.PI;
    helm.position.set(-0.55, 0.85, 0.35);
    helm.rotation.set(0.15, 0.4, 0.2);
    armL.rotation.z = -0.5; armL.rotation.x = 0;
    armR.rotation.z = 0.25; armR.rotation.x = 0;
    const camP = new THREE.Vector3(hero.position.x + 0.4, 1.55, hero.position.z + 2.35);
    camera.position.lerp(camP, Math.min(1, dt * 3.5));
    camera.lookAt(hero.position.x, 1.35, hero.position.z);
    camera.fov = THREE.MathUtils.lerp(camera.fov, 36, dt * 1.2);
    camera.updateProjectionMatrix();
  } else if (t < T.WALK) {
    act("Walk to rocket");
    if (!said.walk) { said.walk = true; cap("Boarding the Starship"); }
    const u = clamp01((t - T.CLOSE) / (T.WALK - T.CLOSE));
    const e = u * u * (3 - 2 * u);
    hero.position.lerpVectors(walkFrom, walkTo, e);
    hero.position.y = Math.abs(Math.sin(u * Math.PI * 6)) * 0.04;
    const face = Math.atan2(walkTo.x - walkFrom.x, walkTo.z - walkFrom.z);
    hero.rotation.y = face;
    helm.position.set(-0.58, 0.75 + Math.sin(t * 6) * 0.04, 0.3);
    helm.rotation.set(0.2 + Math.sin(t * 5) * 0.08, 0.5, 0.25);
    armL.rotation.z = -0.55; armL.rotation.x = Math.sin(t * 6) * 0.15;
    armR.rotation.z = 0.3; armR.rotation.x = Math.sin(t * 6 + Math.PI) * 0.25;
    const side = new THREE.Vector3(
      hero.position.x + Math.cos(face) * 5.5,
      1.7 + Math.sin(u * Math.PI) * 0.4,
      hero.position.z + Math.sin(face) * 5.5 + 2.5
    );
    camera.position.lerp(side, Math.min(1, dt * 2.2));
    camera.lookAt(hero.position.x, 1.3, hero.position.z);
    camera.fov = THREE.MathUtils.lerp(camera.fov, 48, dt * 2);
    camera.updateProjectionMatrix();
  } else if (t < T.HELM) {
    act("Helmet sealed");
    if (!said.helm) { said.helm = true; cap("Helmet sealed"); }
    hero.position.copy(walkTo); hero.position.y = 0;
    hero.rotation.y = Math.atan2(-walkTo.x, -walkTo.z + 0.01);
    const u = clamp01((t - T.WALK) / (T.HELM - T.WALK));
    const hip = new THREE.Vector3(-0.55, 0.85, 0.35);
    const up = new THREE.Vector3(0.1, 2.0, 0.2);
    const head = new THREE.Vector3(0, 1.55, 0.05);
    if (u < 0.55) {
      const k = u / 0.55;
      helm.position.lerpVectors(hip, up, k * k * (3 - 2 * k));
    } else {
      const k = (u - 0.55) / 0.45;
      helm.position.lerpVectors(up, head, k * k * (3 - 2 * k));
      if (k > 0.7) { helm.scale.setScalar(1); hero.userData.head.visible = false; }
    }
    helm.rotation.set(0.1 * (1 - u), 0.4 * (1 - u), 0);
    armL.rotation.z = -0.2 - u * 0.8;
    armL.rotation.x = -u * 1.1;
    const camP = new THREE.Vector3(hero.position.x + 2.2, 1.7, hero.position.z + 3.2);
    camera.position.lerp(camP, Math.min(1, dt * 3));
    camera.lookAt(hero.position.x, 1.45, hero.position.z);
  } else if (t < T.APPROACH) {
    act("Approach hatch");
    if (!said.app) { said.app = true; cap(""); }
    const u = clamp01((t - T.HELM) / (T.APPROACH - T.HELM));
    hero.position.lerpVectors(walkTo, hatch, u * u * (3 - 2 * u));
    hero.rotation.y = Math.atan2(-hero.position.x, -hero.position.z);
    helm.position.set(0, 1.55, 0.05);
    helm.rotation.set(0, 0, 0);
    helm.scale.setScalar(1);
    hero.userData.head.visible = false;
    armL.rotation.set(0, 0, -0.3);
    armR.rotation.set(0, 0, 0.3);
    const camP = new THREE.Vector3(hero.position.x + 3.5, 2.0, hero.position.z + 5.5);
    camera.position.lerp(camP, Math.min(1, dt * 2.5));
    camera.lookAt(0, 6, 0);
  } else if (t < T.TURN) {
    act("Battlefield reveal");
    if (!said.turn) { said.turn = true; cap("Look what we did"); }
    const u = clamp01((t - T.APPROACH) / (T.TURN - T.APPROACH));
    hero.position.copy(hatch);
    hero.rotation.y = smooth(0, Math.PI, u);
    const camNear = new THREE.Vector3(hatch.x - 1.5, 2.0, hatch.z + 3.5);
    const camWide = new THREE.Vector3(hatch.x + 2.0, 3.2, hatch.z + 12);
    camera.position.lerpVectors(camNear, camWide, u * u);
    camera.lookAt(
      hatch.x + Math.sin(hero.rotation.y) * 8,
      0.8,
      hatch.z + Math.cos(hero.rotation.y) * 10
    );
    camera.fov = THREE.MathUtils.lerp(camera.fov, 55, dt * 2);
    camera.updateProjectionMatrix();
  } else if (t < T.FIST) {
    act("Fist raise");
    if (!said.fist) { said.fist = true; cap("For the purge"); }
    const u = clamp01((t - T.TURN) / (T.FIST - T.TURN));
    hero.position.copy(hatch);
    hero.rotation.y = Math.PI;
    armR.rotation.z = 0.2;
    armR.rotation.x = -u * 2.4;
    fistSpr.visible = true;
    fistSpr.position.set(hero.position.x + 0.4, 2.4 + u * 0.5, hero.position.z + 0.15);
    fistSpr.scale.setScalar(0.9 + u * 1.3);
    const camP = new THREE.Vector3(hero.position.x, 1.8, hero.position.z + 5.5);
    camera.position.lerp(camP, Math.min(1, dt * 3));
    camera.lookAt(hero.position.x, 1.7, hero.position.z);
    shake = Math.max(shake, 0.1);
  } else if (t < T.FINGER) {
    act("Farewell");
    if (!said.finger) { said.finger = true; cap("So long"); fistSpr.visible = false; }
    const u = clamp01((t - T.FIST) / (T.FINGER - T.FIST));
    hero.position.copy(hatch);
    hero.rotation.y = Math.PI;
    armR.rotation.x = -1.2;
    armR.rotation.z = 0.1;
    fingerSpr.visible = true;
    fingerSpr.position.set(hero.position.x + 0.5, 2.35 + Math.sin(t * 3) * 0.05, hero.position.z + 0.25);
    fingerSpr.scale.setScalar(Math.min(2.6, 0.5 + u * 2.4));
    const camP = new THREE.Vector3(hero.position.x - 0.5, 1.65, hero.position.z + 4.2);
    camera.position.lerp(camP, Math.min(1, dt * 3.5));
    camera.lookAt(hero.position.x, 1.6, hero.position.z);
    camera.fov = THREE.MathUtils.lerp(camera.fov, 36, dt * 2);
    camera.updateProjectionMatrix();
  } else if (t < T.ENTER) {
    act("Board");
    if (!said.enter) { said.enter = true; cap("Ignition sequence"); fingerSpr.visible = false; }
    const u = clamp01((t - T.FINGER) / (T.ENTER - T.FINGER));
    hero.position.lerpVectors(hatch, door, u * u * (3 - 2 * u));
    hero.position.y = u * 1.2;
    hero.rotation.y = smooth(Math.PI, 0, u);
    hero.scale.setScalar(1 - u * 0.35);
    if (u > 0.85) hero.visible = false;
    const camP = new THREE.Vector3(6, 3 + u * 2, 10);
    camera.position.lerp(camP, Math.min(1, dt * 2));
    camera.lookAt(0, 4 + u * 4, 0);
  } else if (t < T.IGNITE) {
    act("Ignition");
    if (!said.ign) {
      said.ign = true;
      cap("Liftoff");
      rocket.userData.plume.visible = true;
      shake = 0.9;
      padLight.intensity = 90;
    }
    hero.visible = false;
    rocket.position.x = Math.sin(t * 40) * 0.03;
    rocket.position.z = Math.cos(t * 35) * 0.02;
    rocket.userData.plume.children.forEach((c, i) => {
      c.scale.setScalar(0.9 + Math.random() * 0.35 + Math.sin(t * 20 + i) * 0.1);
    });
  } else {
    act("Blast-off");
    if (!said.lift) { said.lift = true; cap("Mars on the horizon"); }
    hero.visible = false;
    const lt = t - T.IGNITE;
    rocket.position.y += 6.2 * dt;
    rocket.position.x = Math.sin(lt * 1.2) * 0.15;
    rocket.rotation.z = Math.sin(lt * 1.5) * 0.02;
    rocket.userData.plume.children.forEach((c, i) => {
      c.scale.setScalar(1.15 + Math.sin(t * 12 + i) * 0.3);
      if (c.material) c.material.opacity = 0.55 + Math.random() * 0.35;
    });
    padLight.intensity = 70 + Math.sin(t * 20) * 20;
    const ang = lt * 0.18;
    const dist = 18 + lt * 2.2;
    const camP = new THREE.Vector3(
      Math.cos(ang) * dist,
      4 + lt * 1.5,
      Math.sin(ang) * dist + 8
    );
    camera.position.lerp(camP, Math.min(1, dt * 1.6));
    camera.lookAt(rocket.position.x, rocket.position.y + 10, rocket.position.z);
    camera.fov = THREE.MathUtils.lerp(camera.fov, 58, dt * 0.8);
    camera.updateProjectionMatrix();
    mars.position.set(22, 38 + Math.sin(t * 0.3) * 1.5, -48);
    mars.rotation.y += dt * 0.05;
    shake = Math.max(0, 0.35 * (1 - lt / 8));
    if (t >= T.VICTORY) {
      playing = false;
      cap("");
      endEl.classList.add("show");
    }
  }
}

function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  /* camera shake */
  if (shake > 0.001) {
    camera.position.x += (Math.random() - 0.5) * shake * 0.35;
    camera.position.y += (Math.random() - 0.5) * shake * 0.25;
    shake *= 0.92;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

$("btnReplay").onclick = () => reset();
$("btnAgain").onclick = () => reset();
addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "KeyR") { e.preventDefault(); reset(); }
});

reset();
frame();
</script>
</body>
</html>
